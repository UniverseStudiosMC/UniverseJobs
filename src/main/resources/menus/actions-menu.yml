# Job Actions Menu Configuration
# This file controls the appearance and behavior of job actions menu

# Menu title (supports MiniMessage and PlaceholderAPI)
title: "<#FFD700><bold>{job_name} - Actions</bold>"

# Menu size (must be multiple of 9, max 54)
size: 54

# Pagination settings
pagination:
  enabled: true

# Fill item configuration
fill-item:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  display-name: " "
  lore: []
  amount: 1
  slots: []  # Empty = use global fill-slots. Specify slots like [1, 2, 3, 9, 18] to override
  custom-model-data: 0
  glow: false
  hide-attributes: true
  hide-enchants: true
  hideToolTip: true

# Slots to fill (empty = all empty slots)
fill-slots: []

# Content slots where action items will be placed
content-slots: [10, 11, 12, 19, 20, 21]


# Static items
static-items:
  info-header:
    enabled: true
    material: DIAMOND_SWORD
    display-name: "<#FFD700><bold>Job Actions</bold>"
    lore:
      - "<gray>This section shows all"
      - "<gray>available actions for this job"
      - ""
      - "<gray>Total Actions: <#FFD700>{total_actions}"
    amount: 1
    slots: [4]
    custom-model-data: 0
    glow: true
    hide-attributes: true
    hide-enchants: false
    action: none

# Navigation items
navigation-items:
  previous:
    enabled: true
    material: ARROW
    display-name: "<#abffb3>← Previous Page"
    lore:
      - "<#FFD700>Click to go to the previous page"
      - ""
      - "<gray>Page: <#FFD700>{current_page}<gray>/<#FFD700>{total_pages}"
      - "<gray>Actions: <#FFD700>{total_items}"
    amount: 1
    slots: [45]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: previous_page
    sound: "UI_BUTTON_CLICK"
    
  next:
    enabled: true
    material: ARROW
    display-name: "<#abffb3>Next Page →"
    lore:
      - "<#FFD700>Click to go to the next page"
      - ""
      - "<gray>Page: <#FFD700>{current_page}<gray>/<#FFD700>{total_pages}"
      - "<gray>Actions: <#FFD700>{total_items}"
    amount: 1
    slots: [53]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: next_page
    sound: "UI_BUTTON_CLICK"
    
  back:
    enabled: true
    material: ARROW
    display-name: "<#abffb3>← Back to Job Menu"
    lore:
      - "<#FFD700>Click to go back to the job menu"
    amount: 1
    slots: [48]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: back
    sound: "UI_BUTTON_CLICK"
    
  close:
    enabled: true
    material: BARRIER
    display-name: "<#FF6B6B>Close Menu"
    lore:
      - "<#FFD700>Click to close this menu"
    amount: 1
    slots: [50]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: close
    sound: "BLOCK_CHEST_CLOSE"
    
  info:
    enabled: true
    material: COMPASS
    display-name: "<#FFD700>Menu Information"
    lore:
      - "<gray>Job: <#FFD700>{job_name}"
      - "<gray>Total Actions: <#FFD700>{total_actions}"
      - "<gray>Page: <#FFD700>{current_page}<gray>/<#FFD700>{total_pages}"
    amount: 1
    slots: [49]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: none

# Action item format configuration
# This defines how action items appear in the menu
# Available placeholders:
# - {action_type} - The action type (BREAK, KILL, etc.)
# - {action_target} - The target (STONE, ZOMBIE, etc.)
# - {action_name} - Internal action name
# - {action_display_name} - Custom display name from config
# - {action_lore} - Custom lore lines from config
# - {action_xp_base} - XP reward for this action without boost
# - {action_xp} - XP reward for this action with boost
# - {action_xp_multiplier} - current XP multiplier for this action
# - {action_money_multiplier} - current MONEY multiplier for this action
# - {action_money} - Money reward for this action
# - {action_interact_type} - Interaction type (for BLOCK_INTERACT)
# - {action_requirements} - Requirements summary
# - {action_cooldown} - Cooldown information
action-item-format:
  display_name_bonus: ""
  hide_line:
    when_no_money: 6
    when_no_xp: 5
  lore_bonus:
    - "{action_display_name}"
    - "{action_lore}"
    - ""
    - "<gray>Rewards:"
    - "<gray>├ <gray>XP: <#abffb3>+{action_xp} {action_xp_multiplier}"
    - "<gray>└ <gray>Money: <#FFD700>${action_money} {action_money_multiplier}"
    - "{action_requirements}"
    - ""
  # Item settings
  amount: 1
  glow: false
  hide-attributes: true
  hide-enchants: true