# Global Rankings Menu Configuration
# This file controls the appearance and behavior of the global rankings menu

# Menu title (supports MiniMessage and PlaceholderAPI)
title: "<#FFD700><bold>Global Job Rankings</bold>"

# Menu size (must be multiple of 9, max 54)
size: 54

# Pagination settings
pagination:
  enabled: false
  items-per-page: 35

# Fill item configuration
fill-item:
  enabled: true
  hideToolTip: true

# Slots to fill (empty = all empty slots)
fill-slots: []

# Content slots where ranking items will be placed
content-slots: [13, 21, 22, 23, 29, 30, 31, 32, 33]


# Static items
static-items:
  trophy:
    enabled: false
    material: GOLDEN_APPLE
    display-name: "<#FFD700><bold>Top Players</bold>"
    lore:
      - "<gray>View the best players"
      - "<gray>in each job category"
      - ""
      - "<gray>Select a job below to"
      - "<gray>view its rankings"
    amount: 1
    slots: [4]
    custom-model-data: 0
    glow: true
    hide-attributes: true
    hide-enchants: true
    action: none
    
  ranking-info:
    enabled: true
    material: LECTERN
    display-name: "<#FFD700><bold>Rankings Information</bold>"
    lore:
      - "<gray>Rankings are updated in real-time"
      - "<gray>based on player levels and XP"
      - ""
      - "<gray>Ranking factors:"
      - "<gray>- Level (primary)"
      - "<gray>- Total XP (secondary)"
    amount: 1
    slots: [8]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: none

# Job selection button configuration
job-selection:
  jobs: {}
  default-format:
    slots:
    selected:
      material: "{job_material}"
      custom-model-data: "{job_custom-model-data}"
      display-name: "<#FFD700>{job_name}"
      lore:
        - ""
        - "<gray>Click to view rankings for this job"
        - ""
        - "<gray>Players with this job: <#FFD700>{player_count}"
        - ""
        - "<gray>Top Player: <#abffb3>{top_player}"
        - "<gray>Top Level: <#abffb3>{top_level}"
      amount: 1
      glow: true
      hide-attributes: true
      hide-enchants: false

    not_selected:
      material: "{job_material}"
      custom-model-data: "{job_custom-model-data}"
      display-name: "<#FFD700>{job_name}"
      lore:
        - ""
        - "<gray>Click to view rankings for this job"
        - ""
        - "<gray>Players with this job: <#FFD700>{player_count}"
        - ""
        - "<gray>Top Player: <#abffb3>{top_player}"
        - "<gray>Top Level: <#abffb3>{top_level}"
      amount: 1
      glow: false
      hide-attributes: true
      hide-enchants: false

# Navigation items
navigation-items:
  previous:
    enabled: false
    material: ARROW
    display-name: "<#abffb3>← Previous Page"
    lore:
      - "<#FFD700>Click to go to the previous page"
      - ""
      - "<gray>Page: <#FFD700>{current_page}<gray>/<#FFD700>{total_pages}"
      - "<gray>Players: <#FFD700>{total_players}"
    amount: 1
    slots: [45]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: previous_page
    
  next:
    enabled: false
    material: ARROW
    display-name: "<#abffb3>Next Page →"
    lore:
      - "<#FFD700>Click to go to the next page"
      - ""
      - "<gray>Page: <#FFD700>{current_page}<gray>/<#FFD700>{total_pages}"
      - "<gray>Players: <#FFD700>{total_players}"
    amount: 1
    slots: [53]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: next_page
    
  back:
    enabled: true
    material: ARROW
    display-name: "<#abffb3>← Back to Jobs Menu"
    lore:
      - "<#FFD700>Click to go back to the main jobs menu"
    amount: 1
    slots: [48]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: back
    
  close:
    enabled: false
    material: BARRIER
    display-name: "<#FF6B6B>Close Menu"
    lore:
      - "<#FFD700>Click to close this menu"
    amount: 1
    slots: [49]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: close
    
  info:
    enabled: false
    material: COMPASS
    display-name: "<#FFD700>Ranking Statistics"
    lore:
      - "<gray>Selected Job: <#FFD700>{selected_job}"
      - "<gray>Total Players: <#FFD700>{total_players}"
      - "<gray>Page: <#FFD700>{current_page}<gray>/<#FFD700>{total_pages}"
      - ""
      - "<gray>Your ranking will be highlighted"
      - "<gray>if you have joined this job"
    amount: 1
    slots: [50]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: none

# Ranking entry configuration
# Each rank can be fully customized individually or use default settings
ranking-entries:
  # Rank 1 - First place
  rank-1:
    enabled: true
    slot: 13  # Specific slot for rank 1 (optional, uses content-slots if not set)
    material: PLAYER_HEAD
    player-head: "{player_name}"
    display-name: "<#FFD700><bold>🏆 #1 - {player}"
    lore:
      - ""
      - "<gray>Player: <#FFD700><bold>{player}"
      - "<gray>Level: <#FFD700><bold>{level}"
      - "<gray>Total XP: <#FFD700><bold>{xp}"
      - ""
      - "<#FFD700>⭐ Top Player ⭐"
    amount: 1
    glow: true
    hide-attributes: true
    hide-enchants: false
    custom-model-data: 0

  # Rank 2 - Second place
  rank-2:
    enabled: true
    slot: 21  # Specific slot for rank 2
    material: PLAYER_HEAD
    player-head: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNGQ0MjMzN2JlMGJkY2EyMjI4OWQ2ZTM4YWI5NTZmZjc3NmE3YjVmNzU2ZTI5MzU3MmY0YmQ2N2Q0MzRiYmNjZCJ9fX0="  # Silver trophy head
    display-name: "<#C0C0C0><bold>🥈 #2 - {player}"
    lore:
      - ""
      - "<gray>Player: <#C0C0C0><bold>{player}"
      - "<gray>Level: <#C0C0C0><bold>{level}"
      - "<gray>Total XP: <#C0C0C0><bold>{xp}"
    amount: 1
    glow: false
    hide-attributes: true
    hide-enchants: false
    custom-model-data: 0

  # Rank 3 - Third place
  rank-3:
    enabled: true
    slot: 23  # Specific slot for rank 3
    material: PLAYER_HEAD
    player-head: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvOWY2Mjg5YzMzNjIzNWRmYzc1YjEzMmJjNzkzOTlmODgyMTlhOWZjNGNlMDg2YzNiNDNmYzg4MmNjNmFkNjA2YiJ9fX0="  # Bronze trophy head
    display-name: "<#CD7F32><bold>🥉 #3 - {player}"
    lore:
      - ""
      - "<gray>Player: <#CD7F32><bold>{player}"
      - "<gray>Level: <#CD7F32><bold>{level}"
      - "<gray>Total XP: <#CD7F32><bold>{xp}"
    amount: 1
    glow: false
    hide-attributes: true
    hide-enchants: false
    custom-model-data: 0

  # Ranks 4-10 - Top 10
  rank-top10:
    enabled: true
    # No specific slots, uses content-slots
    material: PLAYER_HEAD
    player-head: "{player_texture}"  # Use actual player's head texture
    display-name: "<#abffb3>#{rank} - {player}"
    lore:
      - ""
      - "<gray>Player: <#abffb3>{player}"
      - "<gray>Rank: <#abffb3>#{rank}"
      - "<gray>Level: <#abffb3>{level}"
      - "<gray>Total XP: <#abffb3>{xp}"
      - ""
      - "<gray>Rank: <#abffb3><bold>#{rank}"
    amount: 1
    glow: false
    hide-attributes: true
    hide-enchants: false
    custom-model-data: 0

  # Default ranks (11+)
  rank-default:
    enabled: true
    material: PLAYER_HEAD
    player-head: "{player_texture}"  # Use actual player's head texture
    display-name: "<white>#{rank} - {player}"
    lore:
      - ""
      - "<gray>Player: <white>{player}"
      - "<gray>Level: <white>{level}"
      - "<gray>Total XP: <white>{xp}"
      - ""
      - "<gray>Rank: <white>#{rank}"
    amount: 1
    glow: false
    hide-attributes: true
    hide-enchants: false
    custom-model-data: 0

# Available placeholders for ranking entries:
# {rank} - The player's rank number
# {player} - The player's name
# {level} - The player's level in the job
# {xp} - The player's total XP in the job
# {player_texture} - The player's actual head texture (for PLAYER_HEAD material)