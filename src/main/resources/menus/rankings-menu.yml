# Global Rankings Menu Configuration
# This file controls the appearance and behavior of the global rankings menu

# Menu title (supports MiniMessage and PlaceholderAPI)
title: "<#FFD700><bold>Global Job Rankings</bold>"

# Menu size (must be multiple of 9, max 54)
size: 54

# Pagination settings
pagination:
  enabled: true
  items-per-page: 35

# Fill item configuration
fill-item:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  display-name: " "
  lore: []
  amount: 1
  slots: []  # Empty = use global fill-slots. Specify slots like [1, 2, 3, 9, 18] to override
  custom-model-data: 0
  glow: false
  hide-attributes: true
  hide-enchants: true
  hideToolTip: true

# Slots to fill (empty = all empty slots)
fill-slots: []

# Content slots where ranking items will be placed
content-slots: [19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]

# Navigation slot configuration
navigation-slots:
  previous: [45]
  next: [53]
  back: [48]
  close: [49]
  info: [50]

# Static items
static-items:
  trophy:
    enabled: true
    material: GOLDEN_APPLE
    display-name: "<#FFD700><bold>Top Players</bold>"
    lore:
      - "<gray>View the best players"
      - "<gray>in each job category"
      - ""
      - "<gray>Select a job below to"
      - "<gray>view its rankings"
    amount: 1
    slots: [4]
    custom-model-data: 0
    glow: true
    hide-attributes: true
    hide-enchants: true
    action: none
    
  ranking-info:
    enabled: true
    material: LECTERN
    display-name: "<#FFD700><bold>Rankings Information</bold>"
    lore:
      - "<gray>Rankings are updated in real-time"
      - "<gray>based on player levels and XP"
      - ""
      - "<gray>Ranking factors:"
      - "<gray>- Level (primary)"
      - "<gray>- Total XP (secondary)"
    amount: 1
    slots: [8]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: none

# Job selection slots (row 2: slots 10-16)
job-selection-slots: [10, 11, 12, 13, 14, 15, 16]

# Navigation items
navigation-items:
  previous:
    enabled: true
    material: ARROW
    display-name: "<#abffb3>← Previous Page"
    lore:
      - "<#FFD700>Click to go to the previous page"
      - ""
      - "<gray>Page: <#FFD700>{current_page}<gray>/<#FFD700>{total_pages}"
      - "<gray>Players: <#FFD700>{total_players}"
    amount: 1
    slots: [45]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: previous_page
    
  next:
    enabled: true
    material: ARROW
    display-name: "<#abffb3>Next Page →"
    lore:
      - "<#FFD700>Click to go to the next page"
      - ""
      - "<gray>Page: <#FFD700>{current_page}<gray>/<#FFD700>{total_pages}"
      - "<gray>Players: <#FFD700>{total_players}"
    amount: 1
    slots: [53]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: next_page
    
  back:
    enabled: true
    material: ARROW
    display-name: "<#abffb3>← Back to Jobs Menu"
    lore:
      - "<#FFD700>Click to go back to the main jobs menu"
    amount: 1
    slots: [48]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: back
    
  close:
    enabled: true
    material: BARRIER
    display-name: "<#FF6B6B>Close Menu"
    lore:
      - "<#FFD700>Click to close this menu"
    amount: 1
    slots: [49]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: close
    
  info:
    enabled: true
    material: COMPASS
    display-name: "<#FFD700>Ranking Statistics"
    lore:
      - "<gray>Selected Job: <#FFD700>{selected_job}"
      - "<gray>Total Players: <#FFD700>{total_players}"
      - "<gray>Page: <#FFD700>{current_page}<gray>/<#FFD700>{total_pages}"
      - ""
      - "<gray>Your ranking will be highlighted"
      - "<gray>if you have joined this job"
    amount: 1
    slots: [50]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: none

# Ranking display settings
ranking-display:
  # Materials for different ranking positions
  rank-materials:
    1: GOLD_INGOT      # 1st place
    2: IRON_INGOT      # 2nd place
    3: COPPER_INGOT    # 3rd place
    top-10: EMERALD    # 4th-10th place
    default: PLAYER_HEAD # 11th+ place
  
  # Colors for different ranking positions
  rank-colors:
    1: "<#FFD700><bold>"          # Gold
    2: "<#C0C0C0><bold>"          # Silver
    3: "<#CD7F32><bold>"          # Bronze
    top-10: "<#abffb3>"           # Green
    default: "<white>"            # White