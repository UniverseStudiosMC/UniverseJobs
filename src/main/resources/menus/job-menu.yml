# Individual Job Menu Configuration
# Modern, clean design with consistent color palette

# Menu title (MiniMessage format with modern styling)
title: "<#32CD32><bold>{job_name}</bold> <#FFD700>Menu"

# Menu size (must be multiple of 9, max 54)
size: 45

# Modern glass pane background
fill-item:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  display-name: ""
  lore: []
  amount: 1
  slots: []  # Empty = use global fill-slots. Specify slots like [1, 2, 3, 9, 18] to override
  custom-model-data: 0
  glow: false
  hide-attributes: true
  hide-enchants: true
  hideToolTip: true

# Static items (decorative items)
static-items:
  border-left:
    enabled: true
    material: WHITE_STAINED_GLASS_PANE
    display-name: " "
    lore: []
    amount: 1
    slots: [0, 9, 18, 27, 36]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: true
    action: none
    
  border-right:
    enabled: true
    material: WHITE_STAINED_GLASS_PANE
    display-name: " "
    lore: []
    amount: 1
    slots: [8, 17, 26, 35, 44]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: true
    action: none

# Navigation items
navigation-items:
  back:
    enabled: true
    material: ARROW
    display-name: "<#32CD32>← Back to Jobs Menu"
    lore:
      - "<#FFD700>Click to go back to the main jobs menu"
    amount: 1
    slots: [39]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: back
    
  close:
    enabled: true
    material: BARRIER
    display-name: "<#FF6B6B>Close Menu"
    lore:
      - "<#FFD700>Click to close this menu"
    amount: 1
    slots: [41]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: close

# Main menu items
menu-items:
  job-info:
    enabled: true
    material: BOOK
    display-name: "<#32CD32><bold>{job_name}</bold>"
    lore:
      - ""
      - "<#FFD700>Description:"
      - "<white>{job_description}"
      - ""
      - "<#FFD700>Max Level: <#32CD32>{job_max_level}"
      - "<#FFD700>Permission: <#32CD32>{job_permission}"
      - ""
      - "<gray>Click for more details"
    amount: 1
    slots: [13]
    custom-model-data: 0
    glow: true
    hide-attributes: true
    hide-enchants: false
    action: none
    
  player-stats:
    enabled: true
    material: PLAYER_HEAD
    display-name: "<#32CD32><bold>Your Statistics</bold>"
    lore:
      - ""
      - "<#FFD700>Job: <#32CD32>{job_name}"
      - "<#FFD700>Status: {job_status}"
      - ""
      - "<gray>├ <#FFD700>Level: <#32CD32>{player_level}<gray>/<#FFD700>{job_max_level}"
      - "<gray>├ <#FFD700>XP: <#32CD32>{player_xp}"
      - "<gray>├ <#FFD700>Next Level: <#32CD32>{xp_to_next} XP"
      - "<gray>└ <#FFD700>Progress: <#32CD32>{progress_percent}%"
      - ""
      - "<gray>└ {progress_bar}"
    amount: 1
    slots: [22]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: none
    skull-owner: "{player_name}"
    
  join-leave-button:
    enabled: true
    # Material will be dynamically set based on job status
    material: EMERALD_BLOCK
    display-name: "<#32CD32><bold>Join Job</bold>"
    lore:
      - ""
      - "<#FFD700>Click to join this job"
      - "<#FFD700>and start earning rewards!"
      - ""
      - "<#FFD700>Requires: <white>{job_permission}"
    amount: 1
    slots: [29]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: toggle-job
    # Alternative configuration when player has the job
    has-job-material: REDSTONE_BLOCK
    has-job-display-name: "<#FF6B6B><bold>Leave Job</bold>"
    has-job-lore:
      - ""
      - "<#FFD700>Click to leave this job"
      - ""
      - "<#FF6B6B><bold>Warning:</bold>"
      - "<#FF6B6B>You will lose all progress!"
    
  actions-button:
    enabled: true
    material: DIAMOND_SWORD
    display-name: "<#32CD32><bold>Job Actions</bold>"
    lore:
      - ""
      - "<#FFD700>View all available actions"
      - "<#FFD700>for this job"
      - ""
      - "<gray>• <#FFD700>Total Actions: <#32CD32>{total_actions}"
      - ""
      - "<#FFD700>Click to view actions"
    amount: 1
    slots: [30]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: open-actions
    
  rewards-button:
    enabled: true
    material: EMERALD
    display-name: "<#32CD32><bold>Job Rewards</bold>"
    lore:
      - ""
      - "<#FFD700>View all available rewards"
      - "<#FFD700>for this job"
      - ""
      - "<gray>• <#FFD700>Total Rewards: <#32CD32>{total_rewards}"
      - ""
      - "<#FFD700>Click to view rewards"
    amount: 1
    slots: [32]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: open-rewards
    
  rankings-button:
    enabled: true
    material: GOLDEN_HELMET
    display-name: "<#FFD700><bold>Rankings</bold>"
    lore:
      - ""
      - "<#FFD700>View the top players"
      - "<#FFD700>for this job"
      - ""
      - "<gray>• <#FFD700>Your Rank: <#32CD32>#{player_rank}"
      - "<gray>• <#FFD700>Top Player: <#32CD32>{top_player}"
      - ""
      - "<#FFD700>Click to view rankings"
    amount: 1
    slots: [33]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: open-rankings

# Available placeholders for this menu:
# - {job_id} - The job's internal ID
# - {job_name} - The job's display name
# - {job_description} - The job's description
# - {job_max_level} - Maximum level for the job
# - {job_permission} - Permission required for the job
# - {job_status} - Current status (Joined/Not Joined)
# - {player_name} - Player's name
# - {player_level} - Player's current level in the job
# - {player_xp} - Player's current XP in the job
# - {xp_to_next} - XP needed for next level
# - {next_level_xp} - Total XP for next level
# - {progress_bar} - Visual XP progress bar
# - {progress_percent} - XP progress percentage
# - {total_actions} - Total number of actions for this job
# - {total_rewards} - Total number of rewards for this job
# - {player_rank} - Player's rank in this job
# - {top_player} - Name of the top player in this job