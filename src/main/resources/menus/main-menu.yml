# Main Jobs Menu Configuration
# This file controls the appearance and behavior of the main jobs menu

# Menu title (supports MiniMessage and PlaceholderAPI)
title: "<#FFD700><bold>Jobs Menu</bold>"

# Menu size (must be multiple of 9, max 54)
size: 54

# Pagination settings
pagination:
  enabled: true
  items-per-page: 28

# Fill item configuration
fill-item:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  display-name: " "
  lore: []
  amount: 1
  slots: []  # Empty = use global fill-slots. Specify slots like [1, 2, 3, 9, 18] to override
  custom-model-data: 0
  glow: false
  hide-attributes: true
  hide-enchants: true
  hideToolTip: true

# Slots to fill (empty = all empty slots)
fill-slots: []

# Content slots where job items will be placed
content-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
# If a job is not listed here, it will be placed automatically in available content slots
job-slots: []
  # miner: 10    # Place miner job in slot 10
  # farmer: 11   # Place farmer job in slot 11
  # builder: 12  # Place builder job in slot 12
  # hunter: 13   # Place hunter job in slot 13

# Static items (always shown in the menu)
static-items:
  info-item:
    enabled: true
    material: BOOK
    display-name: "<#FFD700><bold>Jobs Information</bold>"
    lore:
      - "<gray>Welcome to the Jobs system!"
      - ""
      - "<gray>Choose a job to start earning"
      - "<gray>money and experience points."
      - ""
      - "<gray>Total Jobs: <#FFD700>%universejobs_totaljobs%"
      - "<gray>Your Active Jobs: <#abffb3>%universejobs_global_player_totaljobs%"
    amount: 1
    slots: [4]
    custom-model-data: 0
    glow: true
    hide-attributes: false
    hide-enchants: true
    action: none

# Job item format configuration
# This defines how job items appear in the menu
# Available placeholders:
# - {job_id} - The job's internal ID
# - {job_name} - The job's display name
# - {job_description} - The job's description
# - {job_max_level} - Maximum level for the job
# - {player_level} - Player's current level in the job
# - {player_xp} - Player's current XP in the job
# - {xp_to_next} - XP needed for next level
# - {next_level_xp} - Total XP for next level
# - {has_job} - Yes/No if player has the job
# - {job_status} - Current status (Joined/Not Joined)
# - {job_permission} - Permission required for the job
# - {progress_bar} - Visual XP progress bar
# - {progress_percent} - XP progress percentage
job-item-format:
  use-job-icon: true
  display-name: "<bold>{job_name}</bold>"
  glow: true
  lore:
    - "<gray>{job_description}"
    - ""
    - "<gray>Your Status:"
    - "<gray>├ <gray>Level: <#abffb3>{player_level}<gray>/<#abffb3>{job_max_level} <gray>(<#FFD700>{progress_percent}%<gray>)"
    - "<gray>├ <gray>XP: <#62de6e>{player_xp}"
    - "<gray>└ {progress_bar}"
    - ""
    - "<gray>◆ <gray>Status: {job_status}"
    - ""
    - "<#FFD700>▶ Left-Click to open job menu"
    - "<#abffb3>▶ Right-Click to leave"
  else:  ##when not joined the job
    lore:
      - "<gray>{job_description}"
      - ""
      - "<gray>Your Status:"
      - "<gray>├ <gray>Level: <#abffb3>{player_level}<gray>/<#abffb3>{job_max_level} <gray>(<#FFD700>{progress_percent}%<gray>)"
      - "<gray>├ <gray>XP: <#62de6e>{player_xp}"
      - "<gray>└ {progress_bar}"
      - ""
      - "<gray>◆ <gray>Status: {job_status}"
      - ""
      - "<#FFD700>▶ Left-Click to open job menu"
      - "<#abffb3>▶ Right-Click to join"

# Navigation items
navigation-items:
  previous:
    enabled: true
    material: ARROW
    display-name: "<#abffb3>← Previous Page"
    lore:
      - "<#FFD700>Click to go to the previous page"
      - ""
      - "<gray>Page: <#FFD700>{current_page}<gray>/<#FFD700>{total_pages}"
    amount: 1
    slots: [45]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: previous_page
    
  next:
    enabled: true
    material: ARROW
    display-name: "<#abffb3>Next Page →"
    lore:
      - "<#FFD700>Click to go to the next page"
      - ""
      - "<gray>Page: <#FFD700>{current_page}<gray>/<#FFD700>{total_pages}"
    amount: 1
    slots: [53]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: next_page
    
  close:
    enabled: true
    material: BARRIER
    display-name: "<#FF6B6B>Close Menu"
    lore:
      - "<#FFD700>Click to close this menu"
    amount: 1
    slots: [49]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: close
    
  info:
    enabled: true
    material: COMPASS
    display-name: "<#FFD700>Menu Information"
    lore:
      - "<gray>Total Jobs: <#FFD700>{total_jobs}"
      - "<gray>Your Jobs: <#abffb3>{player_jobs}"
      - "<gray>Page: <#FFD700>{current_page}<gray>/<#FFD700>{total_pages}"
    amount: 1
    slots: [50]
    custom-model-data: 0
    glow: false
    hide-attributes: true
    hide-enchants: false
    action: none
