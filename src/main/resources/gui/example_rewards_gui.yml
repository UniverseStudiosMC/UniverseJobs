# Example Rewards GUI Configuration
# This file defines the GUI layout for displaying rewards
# To use this file, add to your job configuration:
# gui-reward: "example_rewards_gui"

title: "<#FFD700><bold>{job} Rewards</bold>"
size: 54  # Must be multiple of 9 (9, 18, 27, 36, 45, 54)

# Slots where rewards will be displayed
reward-slots:
  - 10
  - 11
  - 20
  - 29
  - 38
  - 39
  - 40
  - 31
  - 22
  - 13
  - 14
  - 15
  - 24
  - 33
  - 42
  - 43

# Fill empty slots with decoration items
fill-items:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "
  slots: []  # Empty = fill all empty slots

# Custom items in the GUI
items:
  border_top:
    material: WHITE_STAINED_GLASS_PANE
    amount: 1
    display-name: " "
    slots: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  
  border_bottom:
    material: WHITE_STAINED_GLASS_PANE
    amount: 1
    display-name: " "
    slots: [45, 46, 47, 48, 49, 50, 51, 52, 53]

# Navigation buttons
navigation:
  previous-page:
    material: ARROW
    amount: 1
    display-name: "<#abffb3>Previous Page"
    lore:
      - "<#FFD700>Click to go back"
    slots: [9]
  
  next-page:
    material: ARROW
    amount: 1
    display-name: "<#abffb3>Next Page"
    lore:
      - "<#FFD700>Click to continue"
    slots: [44]
  
  close:
    material: BARRIER
    amount: 1
    display-name: "<#FF6B6B>Close"
    lore:
      - "<#FFD700>Click to close menu"
    slots: [49]
  
  refresh:
    material: ENDER_EYE
    amount: 1
    display-name: "<#abffb3>Refresh"
    lore:
      - "<#FFD700>Click to refresh rewards"
    slots: [40]
  
  info:
    material: BOOK
    amount: 1
    display-name: "<#FFD700>Information"
    lore:
      - "<gray>View reward information"
    slots: [4]

# Reward item configuration
reward-item:
  # Materials for different reward statuses
  materials:
    retrievable: LIME_SHULKER_BOX      # Can be claimed
    blocked: RED_SHULKER_BOX           # Requirements not met
    retrieved: GRAY_SHULKER_BOX        # Already claimed
  
  # Status indicators shown in item name
  status-indicators:
    retrievable: "<#32CD32>✓"          # Green checkmark
    blocked: "<#FF6B6B>✗"              # Red X
    retrieved: "<#808080>✓"            # Gray checkmark
  
  # Format for reward item names - supports PlaceholderAPI
  name-format: "{status} <#FFD700>{name}"
  
  # Complete lore format with all available placeholders
  lore-format:
    - "{description}"
    - ""
    - "<gray>Required Level: <#FFD700>{level}"
    - "<gray>Status: {status_description}"
    - "{repeatable_info}"
    - "{cooldown}"
    - "{reward_items}"
    - "{economy_reward}"
    - "{commands}"
    - "{click_instruction}"
  
  # Click instruction when reward is available
  click-instruction: "<#32CD32>▶ Click to claim!"
  
  # Time format - supports {hours}, {days}, {weeks} or custom format
  time-format: "{hours}h"
  
  # Custom texts for various elements
  texts:
    repeatable-yes: "<gray>Repeatable: <#32CD32>Yes"
    repeatable-no: "<gray>Repeatable: <#FF6B6B>No"
    cooldown-prefix: "<gray>Cooldown: <#FFD700>"
    rewards-title: "<#FFD700>Rewards:"
    more-items: "<gray>... and <#FFD700>{count}<gray> more"
    item-format: "<gray>- <white>{amount}x {name}"
    special-rewards: "<#9370DB>Special rewards"