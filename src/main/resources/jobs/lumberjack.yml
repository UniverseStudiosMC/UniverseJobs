name: "<#8B4513>Lumberjack"
description:
- "Cut down trees and harvest"
- "wood from the forests!"
enabled: true
max-level: 100
permission: "UniverseJobs.job.lumberjack"
icon:
  material: "DIAMOND_AXE"
  custom-model-data: ""

rewards: "lumberjack_rewards"
gui-reward: "lumberjack_rewards_gui"

action-limits:
  auto-restore:
    enabled: true
    time: "00:00"

# mcMMO multipliers when abilities are active
mcmmo:
  treefeller:
    money-amplifier: 2.0  # +100% money when Tree Feller is active
    xp-amplifier: 1.8     # +80% XP when Tree Feller is active

xp:
  type: "CURVE"
  xp: "example"
  message:
    type: "BOSSBAR"
    text: "{message_xp} {message_money} <gray>| <#8B4513>{job} <gray>Level <#32CD32>{level}"
    money: "<#FFD700>{money} $ <gray>({+-}{money_per_action})"
    xp: "<#abffb3>{xp} xp <gray>({+-}{xp_per_action})"
    options:
      color: "YELLOW"
      style: "SEGMENTED_0"
      fade-in: 10
      fade-out: 20
      duration: 40
      show-progress: true

