name: "<#ff6b47>Hunter"
description:
- "Hunt dangerous creatures and"
- "explore the wilderness!"
enabled: true
max-level: 100
permission: "UniverseJobs.job.hunter"
icon:
  material: "BOW"
  custom-model-data: ""

rewards: "hunter_rewards"
gui-reward: "hunter_rewards_gui"

action-limits:
  auto-restore:
    enabled: false
    time: "00:00"

xp:
  type: "CURVE"
  xp: "default"
  message:
    type: "BOSSBAR"
    text: "{message_xp} {message_money} <gray>| <#ff6b47>{job} <gray>Level <#32CD32>{level}"
    money: "<#FFD700>{money} $ <gray>({+-}{money_per_action})"
    xp: "<#abffb3>{xp} xp <gray>({+-}{xp_per_action})"
    options:
      color: "RED"
      style: "SEGMENTED_0"
      fade-in: 10
      fade-out: 20
      duration: 40
      show-progress: true

