levelup-actions:
  broadcast:
    type: "broadcast"
    min-level: 1
    level-interval: 10
    messages:
    - "<#90db8a>{player} <#9a9c9a>has reached level <#ff6b47>{level} <#9a9c9a>in <#ff6b47>Hunter<#9a9c9a>!"
  title:
    type: "title"
    min-level: 1
    level-interval: 1
    title: "<#ff6b47>Reached level {level}"
    subtitle: "<#9a9c9a>in <#ff6b47>Hunter<#9a9c9a>!"
    fade-in: 5
    stay: 20
    fade-out: 10
  sound:
    type: "sound"
    min-level: 1
    level-interval: 1
    sound: ENTITY_PLAYER_LEVELUP
  particle:
    type: "particle"
    min-level: 1
    level-interval: 1
    count: "20"
    particle: "CRIT"