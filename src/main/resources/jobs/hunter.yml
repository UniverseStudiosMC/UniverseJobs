name: "<#ff6b47>Hunter"
description:
- "Hunt dangerous creatures and"
- "explore the wilderness!"
enabled: true
max-level: 100
permission: "UniverseJobs.job.hunter"
icon:
  material: "BOW"
  model_data_component:
    strings: [ ]

rewards: "hunter_rewards"
gui-reward: "hunter_rewards_gui"

action-limits:
  auto-restore:
    enabled: false
    time: "00:00"

# mcMMO multipliers when abilities are active
mcmmo:
  berserk:
    money-amplifier: 1.7  # +70% money when Berserk is active
    xp-amplifier: 1.4     # +40% XP when Berserk is active
  skullsplitter:
    money-amplifier: 1.6  # +60% money when Skull Splitter is active
    xp-amplifier: 1.3     # +30% XP when Skull Splitter is active
  serratedstrikes:
    money-amplifier: 1.5  # +50% money when Serrated Strikes is active
    xp-amplifier: 1.2     # +20% XP when Serrated Strikes is active

xp:
  type: "CURVE"
  xp: "example"
  message:
    type: "BOSSBAR"
    text: "{message_xp} {message_money} <gray>| <#32cd32>{job} <gray>Level <#32CD32>{level}"
    money: "<#FFD700>{money} $ <gray>({+-}{money_per_action})"
    xp: "<#abffb3>{xp} xp <gray>({+-}{xp_per_action})"
    options:
      color: "GREEN"
      style: "SEGMENTED_0"
      fade-in: 10
      fade-out: 20
      duration: 40
      show-progress: true

actions:
  KILL:
    # Hostile mobs
    kill_zombie:
      target: "ZOMBIE"
      display-name: "Zombie"
      action-menu-priority: 1
      lore:
      - "<gray>Kill zombies"
      xp: 3.0
      money: 2.5

    kill_skeleton:
      target: "SKELETON"
      display-name: "Skeleton"
      action-menu-priority: 2
      lore:
      - "<gray>Kill skeletons"
      xp: 3.5
      money: 3.0

    kill_creeper:
      target: "CREEPER"
      display-name: "Creeper"
      action-menu-priority: 3
      lore:
      - "<gray>Kill creepers"
      xp: 4.0
      money: 4.0

    kill_spider:
      target: "SPIDER"
      display-name: "Spider"
      action-menu-priority: 4
      lore:
      - "<gray>Kill spiders"
      xp: 2.5
      money: 2.0

    kill_enderman:
      target: "ENDERMAN"
      display-name: "Enderman"
      action-menu-priority: 5
      lore:
      - "<gray>Kill endermen"
      xp: 8.0
      money: 10.0

    kill_witch:
      target: "WITCH"
      display-name: "Witch"
      action-menu-priority: 6
      lore:
      - "<gray>Kill witches"
      xp: 6.0
      money: 7.0

    # Nether mobs
    kill_zombie_pigman:
      target: "ZOMBIFIED_PIGLIN"
      display-name: "Zombified Piglin"
      action-menu-priority: 7
      lore:
      - "<gray>Kill zombified piglins"
      xp: 4.5
      money: 5.0

    kill_blaze:
      target: "BLAZE"
      display-name: "Blaze"
      action-menu-priority: 8
      lore:
      - "<gray>Kill blazes"
      xp: 7.0
      money: 8.0

    kill_ghast:
      target: "GHAST"
      display-name: "Ghast"
      action-menu-priority: 9
      lore:
      - "<gray>Kill ghasts"
      xp: 10.0
      money: 12.0

    kill_wither_skeleton:
      target: "WITHER_SKELETON"
      display-name: "Wither Skeleton"
      action-menu-priority: 10
      lore:
      - "<gray>Kill wither skeletons"
      xp: 8.0
      money: 10.0

    # Peaceful mobs
    kill_cow:
      target: "COW"
      display-name: "Cow"
      action-menu-priority: 11
      lore:
      - "<gray>Kill cows"
      xp: 1.5
      money: 2.0

    kill_pig:
      target: "PIG"
      display-name: "Pig"
      action-menu-priority: 12
      lore:
      - "<gray>Kill pigs"
      xp: 1.5
      money: 2.0

    kill_sheep:
      target: "SHEEP"
      display-name: "Sheep"
      action-menu-priority: 13
      lore:
      - "<gray>Kill sheep"
      xp: 1.5
      money: 1.8

    kill_chicken:
      target: "CHICKEN"
      display-name: "Chicken"
      action-menu-priority: 14
      lore:
      - "<gray>Kill chickens"
      xp: 1.0
      money: 1.5

    kill_rabbit:
      target: "RABBIT"
      display-name: "Rabbit"
      action-menu-priority: 15
      lore:
      - "<gray>Kill rabbits"
      xp: 1.2
      money: 1.0

    # Ocean mobs
    kill_squid:
      target: "SQUID"
      display-name: "Squid"
      action-menu-priority: 16
      lore:
      - "<gray>Kill squids"
      xp: 2.0
      money: 1.5

    kill_guardian:
      target: "GUARDIAN"
      display-name: "Guardian"
      action-menu-priority: 17
      lore:
      - "<gray>Kill guardians"
      xp: 6.0
      money: 8.0

    kill_elder_guardian:
      target: "ELDER_GUARDIAN"
      display-name: "Elder Guardian"
      action-menu-priority: 18
      lore:
      - "<gray>Kill elder guardians"
      xp: 15.0
      money: 20.0

  FISH:
    # Fishing
    catch_fish:
      target: "COD"
      display-name: "Cod"
      action-menu-priority: 19
      lore:
      - "<gray>Catch cod"
      xp: 2.0
      money: 1.5

    catch_salmon:
      target: "SALMON"
      display-name: "Salmon"
      action-menu-priority: 20
      lore:
      - "<gray>Catch salmon"
      xp: 2.5
      money: 2.0

    catch_tropical_fish:
      target: "TROPICAL_FISH"
      display-name: "Tropical Fish"
      action-menu-priority: 21
      lore:
      - "<gray>Catch tropical fish"
      xp: 3.0
      money: 2.5

    catch_pufferfish:
      target: "PUFFERFISH"
      display-name: "Pufferfish"
      action-menu-priority: 22
      lore:
      - "<gray>Catch pufferfish"
      xp: 4.0
      money: 3.0

levelup-actions:
  broadcast:
    type: "broadcast"
    min-level: 1
    level-interval: 10
    messages:
    - "<#90db8a>{player} <#9a9c9a>has reached level <#ff6b47>{level} <#9a9c9a>in <#ff6b47>Hunter<#9a9c9a>!"
  title:
    type: "title"
    min-level: 1
    level-interval: 1
    title: "<#ff6b47>Reached level {level}"
    subtitle: "<#9a9c9a>in <#ff6b47>Hunter<#9a9c9a>!"
    fade-in: 5
    stay: 20
    fade-out: 10
  sound:
    type: "sound"
    min-level: 1
    level-interval: 1
    sound: ENTITY_PLAYER_LEVELUP
  particle:
    type: "particle"
    min-level: 1
    level-interval: 1
    count: "20"
    particle: "HAPPY_VILLAGER"