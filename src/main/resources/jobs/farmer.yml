name: "<#32cd32>Farmer"
description:
- "Cultivate crops and raise animals"
- "to feed the world!"
enabled: true
max-level: 100
permission: "UniverseJobs.job.farmer"
icon:
  material: "DIAMOND_HOE"
  custom-model-data: ""

rewards: "farmer_rewards"
gui-reward: "farmer_rewards_gui"

action-limits:
  auto-restore:
    enabled: false
    time: "00:00"

xp:
  type: "CURVE"
  xp: "default"
  message:
    type: "BOSSBAR"
    text: "{message_xp} {message_money} <gray>| <#32cd32>{job} <gray>Level <#32CD32>{level}"
    money: "<#FFD700>{money} $ <gray>({+-}{money_per_action})"
    xp: "<#abffb3>{xp} xp <gray>({+-}{xp_per_action})"
    options:
      color: "GREEN"
      style: "SEGMENTED_0"
      fade-in: 10
      fade-out: 20
      duration: 40
      show-progress: true

actions:
  BREAK:
    # Wheat farming
    harvest_wheat:
      target: "WHEAT"
      age: 7
      display-name: "Wheat"
      lore:
      - "<gray>Harvest fully grown wheat"
      xp: 2.0
      money: 1.5

    # Carrot farming
    harvest_carrot:
