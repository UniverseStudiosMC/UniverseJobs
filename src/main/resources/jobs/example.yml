name: "Example"                               # The displayed job name
description: "Extract treasures from the depths of the earth!"  # Short description
enabled: true                               # Enable (true) or disable (false) the job
max-level: 100                              # Maximum achievable level
permission: "UniverseJobs.job.example"       # Permission required to have this job
icon: 
  material: "DIAMOND_PICKAXE" 
  custom-model-data: ""         
  
rewards: "example_rewards"  # Link to the rewards file
gui-reward: "example_rewards_gui" #Template

action-limits:
    auto-restore:
      enabled: true
      time: "00:00"  # midnight
xp: 
  type: "CURVE"
  xp: "default"
  message:
    type: "BOSSBAR"
    text: "{message_xp} {message_money} <gray>| <#8B4513>{job} <gray>Level <#32CD32>{level}"
    money: "<#FFD700>+{money} $ <gray>({+-}{money_per_action})"
    xp: "<#abffb3>+{xp} xp <gray>({+-}{xp_per_action})"
    options:
      color: "GREEN"
      style: "SEGMENTED_0"
      duration: "8"
      fade-in: 10
      fade-out: 20
      duration: 40
      update-rating: 2
      show-progress: true

actions:
  PLACE:
    simple_place:
      target: "COBBLESTONE"
      display-name: "Place cobblestone"
      lore:
      - "Place cobblestone blocks"
      xp: 0.5
      money: 1.0
      
  BREAK:
    simple_stone:
      target: "stone"                       # Block to break
      display-name: "Break a stone" ## for actions menu
      lore:
      - "Break a stone for gain reward" ## for actions menu
      xp: 1.0                              # XP earned
      money: 3.0                           # Money earned (optional)
    simple_wheat:
      target: "WHEAT"                       # Block to break
      age: 7 #5-7 or 7 etc..
      display-name: "harvest a wheat"
      lore: []
      xp: 2.0
      money: 3.0
  BLOCK_INTERACT: ##
    simple_cobble:
      interact-type: "RIGHT_CLICK" #LEFT_CLICK, LEFT_SHIFT_CLICK, RIGHT_CLICK, RIGHT_SHIFT_CLICK (default: right click)
      target: "COBBLESTONE"
      xp: 1.0 
    simple_customcrops_right:
      interact-type: "RIGHT_CLICK" # CustomCrops only supports RIGHT_CLICK and RIGHT_SHIFT_CLICK interactions
      target: "customcrops:pineapple_stage_1"
      xp: 1.0                              # XP earned
    simple_customcrops_shift_right:
      interact-type: "RIGHT_SHIFT_CLICK" # Shift-right click with CustomCrops
      target: "customcrops:pineapple_stage_1"
      xp: 3.0
  ENTITY_INTERACT:
    zombiekiill:
      interact-type: "LEFT_SHIFT_CLICK" #LEFT_CLICK, LEFT_SHIFT_CLICK, RIGHT_CLICK, RIGHT_SHIFT_CLICK (default: right click)
      target: "mythicmobs:ZOMBIZZZ"
      xp: 1.0   
  ENCHANT: # Enchantment actions with namespace and level support
    # Vanilla Minecraft enchantments (minecraft namespace is default)
    vanilla_sharpness:
      target: "sharpness"                  # Equivalent to "minecraft:sharpness"
      enchant-level: "3-5"                # Only level 3, 4, or 5 sharpness
      xp: 5.0
      money: 2.0
    vanilla_efficiency:
      target: "minecraft:efficiency"       # Explicit namespace
      xp: 3.0
      
    # ExcellentEnchants plugin enchantments
    excellent_tunnel:
      target: "excellentenchants:tunnel"
      enchant-level: "3"                  # Only level 3 tunnel
      xp: 15.0
      money: 10.0
      
    # AdvancedEnchantments plugin enchantments
    advanced_harvest:
      target: "advancedenchantments:harvest"
      # No level requirement - any level works
      xp: 12.0
      money: 8.0
      
    # Level range examples
    high_level_enchants:
      target: "minecraft:*"               # Any vanilla enchantment
      enchant-level: "4-10"              # High level enchantments only
      xp: 20.0
      money: 15.0
      suppress_message: true  # Avoids message spam
      
    # Wildcard examples - all enchantments from a specific plugin
    all_excellent_enchants:
      target: "excellentenchants:*"
      enchant-level: "1-5"               # Level 1 to 5
      xp: 5.0
      
    # Prefix matching - all tunnel-related enchantments
    tunnel_enchants:
      target: "excellentenchants:tunnel_*"
      xp: 10.0

  TRADE:
    simple_trade:
      target: "DIAMOND_SWORD"
      profession: 
        - "ARMORER"
        - "CLERIC"
      xp: 1.0
    armorer_specific:
      target: "IRON_CHESTPLATE"
      profession: "ARMORER"
      xp: 2.0
      money: 5.0
    any_villager_trade:
      target: "EMERALD"
      xp: 0.5

  SHEAR:
    simple_shear:
      target: "SHEEP"
      color: 
        - "RED"
        - "BLUE"
      xp: 1.0
    white_sheep_only:
      target: "SHEEP"
      color: "WHITE"
      xp: 2.0
      money: 1.0
    any_color_sheep:
      target: "SHEEP"  # No color = any color
      xp: 0.5

  EAT:
    simple_eat:
      target: "APPLE" 
      nbt:
        - "MMOITEMS:CONSUMABLE:APPLE"
      xp: 25.0
    custom_crops_food:
      target: "customcrops:apple"
      nbt: "customcrops:apple"
      xp: 10.0
      money: 2.0
    nexo_item:
      target: "nexo:custom_food"
      nbt: "nexo:custom_food"
      xp: 15.0
    itemsadder_food:
      target: "itemsadder:magic_apple"
      nbt: "itemsadder:magic_apple"
      xp: 20.0
      money: 5.0
    vanilla_food:
      target: "BREAD"  # No NBT = any bread
      xp: 1.0

  POTION:
    simple_potion:
      target: "POTION"
      potion-type: "STRENGTH:2"  # Need Strength 2 potion
      xp: 10.0
    speed_potions:
      target: "POTION"
      potion-type:
        - "SPEED:1"
        - "SPEED:2"
      xp: 5.0
      money: 2.0
    healing_potion:
      target: "POTION"
      potion-type: "HEALING:1"  # Instant Health potion
      xp: 3.0
    regeneration_advanced:
      target: "POTION"
      potion-type: "REGENERATION:2"
      xp: 15.0
      money: 5.0
    any_potion:
      target: "POTION"  # No potion-type = any potion
      xp: 1.0

  KILL:
    simple_kill:
      target: "ZOMBIE"
      display-name: "Kill zombies"
      lore:
      - "Eliminate zombies"
      xp: 2.0
      money: 1.5
    mythic_boss:
      target: "mythicmobs:DRAGON_BOSS"
      xp: 50.0
      money: 100.0
      
  FISH:
    simple_fish:
      target: "COD"
      display-name: "Catch fish"
      lore:
      - "Go fishing for rewards"
      xp: 3.0
      money: 2.0
    treasure_fish:
      target: "ENCHANTED_BOOK"  # Treasure fishing
      xp: 15.0
      money: 10.0
      
  BREW:
    simple_brew:
      target: "POTION"
      display-name: "Brew potions"
      lore:
      - "Create potions for XP"
      xp: 5.0
      money: 3.0
      
  CRAFT:
    simple_craft:
      target: "STONE_SWORD"
      display-name: "Craft stone sword"
      lore:
      - "Craft basic weapons"
      xp: 2.0
      money: 1.0
    advanced_craft:
      target: "DIAMOND_PICKAXE"
      xp: 10.0
      money: 15.0

    mine_diamond_vip:
      target: "DIAMOND_ORE"
      xp: 30.0
      money: 100.0
      name: "VIP Diamond Mining" # Optional name for messages
      requirements:
        logic: "AND"
        multiple_condition:
          level_check:
            placeholder:
              placeholder: "%universejobs_player_level%"
              operator: "greater_equal"
              value: "10"
          player_name_check:
            placeholder:
              placeholder: "%player_name%"
              operator: "equals"
              value: "STEVE"
          deny:
            message: "<#FF6B6B>❌ NOT STEVE or insufficient level!"
            cancel-event: true
          accept:
            commands:
            - "eco give %player_name% 200"
 
#################################################################

levelup-actions:
  level_sound:
    type: "command"
    min-level: 1    
    level-interval: 1 
    commands:
    - "broadcast {player} upgrade level {level} in {job} !"
