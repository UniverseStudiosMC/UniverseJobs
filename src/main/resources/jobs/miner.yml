levelup-actions:
  level_announcement:
    type: "command"
    min-level: 1
    level-interval: 5
    commands:
    - "broadcast <#8B4513>⛏️ <#FFD700>{player} <gray>has reached level <#32CD32>{level} <gray>in <#8B4513>Miner<gray>!"

  level_reward:
    type: "command"
    min-level: 10
    level-interval: 10
    commands:
    - "eco give {player} {level * 100}"
    - "tell {player} <#FFD700>💰 Bonus reward: <#32CD32>{level * 100} coins <gray>for reaching level <#FFD700>{level}<gray>!"