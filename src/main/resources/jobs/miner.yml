name: "Miner"
description: "Extract valuable resources from the depths of the earth!"
enabled: true
max-level: 100
permission: "UniverseJobs.job.miner"
icon: 
  material: "DIAMOND_PICKAXE"
  custom-model-data: ""

rewards: "miner_rewards"
gui-reward: "miner_rewards_gui"

action-limits:
  auto-restore:
    enabled: true
    time: "00:00"

xp: 
  type: "CURVE"
  xp: "default"
  message:
    type: "BOSSBAR"
    text: "{message_xp} {message_money} <gray>| <#8B4513>{job} <gray>Level <#32CD32>{level}"
    money: "<#FFD700>+{money} $ <gray>({+-}{money_per_action})"
    xp: "<#abffb3>+{xp} xp <gray>({+-}{xp_per_action})"
    options:
      color: "GREEN"
      style: "SEGMENTED_0"
      fade-in: 10
      fade-out: 20
      duration: 40
      show-progress: true

actions:
  BREAK:
    # Basic stone materials
    break_stone:
      target: "STONE"
      display-name: "Break stone"
      lore:
      - "Mine basic stone blocks"
      xp: 1.0
      money: 0.5

    break_cobblestone:
      target: "COBBLESTONE"
      display-name: "Break cobblestone"
      lore:
      - "Mine cobblestone blocks"
      xp: 0.8
      money: 0.3

    break_deepslate:
      target: "DEEPSLATE"
      display-name: "Break deepslate"
      lore:
      - "Mine deepslate blocks"
      xp: 1.2
      money: 0.6

    # Coal mining
    break_coal_ore:
      target: "COAL_ORE"
      display-name: "Mine coal ore"
      lore:
      - "Extract coal from stone"
      xp: 2.0
      money: 1.5

    break_deepslate_coal_ore:
      target: "DEEPSLATE_COAL_ORE"
      display-name: "Mine deepslate coal ore"
      lore:
