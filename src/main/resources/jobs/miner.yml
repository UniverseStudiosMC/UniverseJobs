name: "<#36eb48>Miner"
description:
- "Extract valuable resources from"
- "the depths of the earth!"
enabled: true
max-level: 100
permission: "UniverseJobs.job.miner"
icon: 
  material: "DIAMOND_PICKAXE"
  custom-model-data: ""

rewards: "miner_rewards"
gui-reward: "miner_rewards_gui"

action-limits:
  auto-restore:
    enabled: false
    time: "00:00"

# mcMMO multipliers when abilities are active
mcmmo:
  superbreaker:
    money-amplifier: 1.5  # +50% money when Super Breaker is active
    xp-amplifier: 1.3     # +30% XP when Super Breaker is active
  gigadrillbreaker:
    money-amplifier: 1.4  # +40% money when Giga Drill Breaker is active
    xp-amplifier: 1.2     # +20% XP when Giga Drill Breaker is active

xp:
  type: "CURVE"
  xp: "example"
  message:
    type: "BOSSBAR"
    text: "{message_xp} {message_money} <gray>| <#98b097>{job} <gray>Level <#32CD32>{level}"
    money: "<#FFD700>{money} $ <gray>({+-}{money_per_action})"
    xp: "<#abffb3>{xp} xp <gray>({+-}{xp_per_action})"
    options:
      color: "GREEN"
      style: "SEGMENTED_0"
      fade-in: 10
      fade-out: 20
      duration: 40
      show-progress: true

actions:
  BREAK:
    # Basic stone materials
    break_stone:
      target: "STONE"
      display-name: "Stone"
      action-menu-priority: 1
      lore:
      - "<gray>Mine basic stone blocks"
      xp: 1.0
      money: 0.5

    break_cobblestone:
      target: "COBBLESTONE"
      display-name: "Cobblestone"
      action-menu-priority: 2
      display-material: "COBBLESTONE:1001"
      lore:
      - "<gray>Mine cobblestone blocks"
      xp: 0.8
      money: 0.3

    break_deepslate:
      target: "DEEPSLATE"
      display-name: "Deepslate"
      action-menu-priority: 3
      lore:
      - "<gray>Mine deepslate blocks"
      xp: "1 + {level} * 0.1"
      money: "0.5 + {level} * 0.05"

    # Coal mining - Equation examples with PlaceholderAPI
    break_coal_ore:
      target: "COAL_ORE"
      display-name: "Coal ore"
      action-menu-priority: 4
      lore:
      - "<gray>Extract coal from stone"
      - "<yellow>XP: 2 + level/10"
      - "<gold>Money: 1.5 * sqrt(level)"
      xp: "2 + {level} / 10"
      money: "1.5 + {level} * 0.1"

    break_deepslate_coal_ore:
      target: "DEEPSLATE_COAL_ORE"
      display-name: "Deepslate coal ore"
      action-menu-priority: 5
      lore:
      - "<gray>Extract coal from deepslate"
      xp: 2.5
      money: 2.0

    # Iron mining
    break_iron_ore:
      target: "IRON_ORE"
      display-name: "Iron ore"
      action-menu-priority: 6
      lore:
      - "<gray>Extract iron from stone"
      xp: 3.0
      money: 3.0

    break_deepslate_iron_ore:
      target: "DEEPSLATE_IRON_ORE"
      display-name: "Deepslate iron ore"
      action-menu-priority: 7
      lore:
      - "<gray>Extract iron from deepslate"
      xp: 3.5
      money: 3.5

    # Gold mining
    break_gold_ore:
      target: "GOLD_ORE"
      display-name: "Mine gold ore"
      action-menu-priority: 14
      lore:
      - "<gray>Extract gold from stone"
      xp: 4.0
      money: 5.0

    break_deepslate_gold_ore:
      target: "DEEPSLATE_GOLD_ORE"
      display-name: "Deepslate gold ore"
      action-menu-priority: 15
      lore:
      - "<gray>Extract gold from deepslate"
      xp: 4.5
      money: 5.5

    break_nether_gold_ore:
      target: "NETHER_GOLD_ORE"
      display-name: "Mine nether gold ore"
      action-menu-priority: 16
      lore:
      - "<gray>Extract gold from netherrack"
      xp: 3.5
      money: 4.5

    # Diamond mining - Advanced equation with power
    break_diamond_ore:
      target: "DIAMOND_ORE"
      display-name: "Diamond ore"
      action-menu-priority: 17
      lore:
      - "<gray>Extract precious diamonds"
      - "<yellow>XP scales with level²"
      xp: "5 + {level} * 0.5 + ({level} / 10) ^ 2"
      money: "10 + {level} * 0.8"

    break_deepslate_diamond_ore:
      target: "DEEPSLATE_DIAMOND_ORE"
      display-name: "Deepslate diamond ore"
      action-menu-priority: 18
      lore:
      - "<gray>Extract diamonds from deepslate"
      - "<yellow>Bonus for high levels"
      xp: "6 + {level} * 0.6 + ({level} / 10) ^ 2"
      money: "11 + {level} * 0.9"

    # Emerald mining - With health-based bonus
    break_emerald_ore:
      target: "EMERALD_ORE"
      display-name: "Emerald ore"
      action-menu-priority: 19
      lore:
      - "<gray>Extract rare emeralds"
      - "<yellow>Health affects rewards!"
      xp: "8 + {level} * 0.7 + {player_health} / 10"
      money: "15 + {level} + {player_health} / 5"

    break_deepslate_emerald_ore:
      target: "DEEPSLATE_EMERALD_ORE"
      display-name: "Deepslate emerald ore"
      action-menu-priority: 20
      lore:
      - "<gray>Extract emeralds from deepslate"
      xp: 11.0
      money: 22.0

    # Redstone mining
    break_redstone_ore:
      target: "REDSTONE_ORE"
      display-name: "Redstone ore"
      action-menu-priority: 12
      lore:
      - "<gray>Extract redstone dust"
      xp: 3.5
      money: 2.5

    break_deepslate_redstone_ore:
      target: "DEEPSLATE_REDSTONE_ORE"
      display-name: "Deepslate redstone ore"
      action-menu-priority: 13
      lore:
      - "<gray>Extract redstone from deepslate"
      xp: 4.0
      money: 3.0

    # Lapis mining
    break_lapis_ore:
      target: "LAPIS_ORE"
      display-name: "Lapis ore"
      action-menu-priority: 10
      lore:
      - "<gray>Extract lapis lazuli"
      xp: 3.0
      money: 2.0

    break_deepslate_lapis_ore:
      target: "DEEPSLATE_LAPIS_ORE"
      display-name: "Deepslate lapis ore"
      action-menu-priority: 11
      lore:
      - "<gray>Extract lapis from deepslate"
      xp: 3.5
      money: 2.5

    # Copper mining
    break_copper_ore:
      target: "COPPER_ORE"
      display-name: "Copper ore"
      action-menu-priority: 8
      lore:
      - "<gray>Extract copper ingots"
      xp: 2.5
      money: 2.0

    break_deepslate_copper_ore:
      target: "DEEPSLATE_COPPER_ORE"
      display-name: "Deepslate copper ore"
      action-menu-priority: 9
      lore:
      - "<gray>Extract copper from deepslate"
      xp: 3.0
      money: 2.5

    # Nether materials
    break_netherrack:
      target: "NETHERRACK"
      display-name: "Netherrack"
      action-menu-priority: 21
      lore:
      - "<gray>Extract nether stone"
      xp: 0.5
      money: 0.2

    break_nether_quartz_ore:
      target: "NETHER_QUARTZ_ORE"
      display-name: "Nether quartz ore"
      action-menu-priority: 22
      lore:
      - "<gray>Extract nether quartz"
      xp: 4.0
      money: 4.0

    # Ancient debris - Progressive scaling with multiple jobs
    break_ancient_debris:
      target: "ANCIENT_DEBRIS"
      display-name: "Ancient debris"
      action-menu-priority: 24
      lore:
      - "<gray>Extract the rarest material"
      - "<yellow>Bonus for having multiple jobs!"
      - "<gold>XP: 20 + level + jobs²"
      xp: "20 + {level} + {job_count} ^ 2"
      money: "40 + {level} * 2 + {job_count} * 5"

    # End materials
    break_end_stone:
      target: "END_STONE"
      display-name: "End stone"
      action-menu-priority: 25
      lore:
      - "<gray>Extract end dimension stone"
      xp: 1.5
      money: 1.0
  PLACE:
    place_cobblestone:
      target: "COBBLESTONE"
      display-name: "Cobblestone"
      action-menu-priority: 26
      lore:
      - "<gray>Place cobblestone blocks"
      xp: 2.2
      money: 0.1


levelup-actions:
  broadcast:
    type: "broadcast"
    min-level: 1
    level-interval: 10
    messages:
    - "<#90db8a>{player} <#9a9c9a>has reached level <#41a63a>{level} <#9a9c9a>in <#98b097>Miner<#9a9c9a>!"
  title:
    type: "title"
    min-level: 1
    level-interval: 1
    title: "<#41a63a>Reached level <#41a63a>{level}"
    subtitle: "<#9a9c9a>in <#98b097>Miner<#9a9c9a>!"
    fade-in: 5
    stay: 20
    fade-out: 10
  sound:
    type: "sound"
    min-level: 1
    level-interval: 1
    sound: ENTITY_PLAYER_LEVELUP
  particle:
    type: "particle"
    min-level: 1
    level-interval: 1
    count: "20"
    particle: "ELECTRIC_SPARK"