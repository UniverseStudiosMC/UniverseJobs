# =====================================
# UniverseJobs Language File - English
# =====================================

# =============
# GENERAL
# =============
general:
  prefix: "&6[&eUniverseJobs&6]&r"
  no-permission: "&cYou don't have permission to do this!"
  player-not-found: "&cPlayer &e{player} &cnot found!"
  job-not-found: "&cJob &e{job} &cnot found!"
  invalid-amount: "&cInvalid amount: &e{amount}"
  invalid-format: "&cInvalid format!"
  must-be-player: "&cThis command can only be executed by players!"

# =============
# COMMANDS
# =============
commands:
  # General command messages
  players-only: "&cThis command can only be used by players!"
  no-permission: "&cYou don't have permission to use this command!"
  player-not-found: "&cPlayer not found!"

  help:
    player: |
      &6=== UniverseJobs Commands ===
      &e/jobs &7- Open main jobs menu

      &6⭐⭐⭐⭐ Most Used:
      &e/jobs join <job> &7- Join a job
      &e/jobs leave <job> &7- Leave a job

      &6⭐⭐⭐ Information:
      &e/jobs list &7- List all available jobs
      &e/jobs stats [player] &7- Show job statistics
      &e/jobs info [job/player] &7- Show job or player information

      &6⭐⭐ Advanced:
      &e/jobs menu <jobname> &7- Open job menu directly
      &e/jobs menu rankings &7- View job leaderboards
    rewards: "&e/jobs rewards open <job> &7- Access job rewards"
    admin: |
      &6⭐ Admin Commands:
      &e/jobs admin &7- Show all admin commands
    console: |
      &6UniverseJobs Console Commands:
      &e/jobs admin &7- Show all admin commands
      &e/jobs actionlimit <restore|status> &7- Manage action limits
  
  # Join Command
  join:
    usage: "&cUsage: /jobs join <job>"
    success: "&aYou joined the &e{job} &ajob!"
    already-have: "&cYou already have the &e{job} &cjob!"
    max-jobs-reached: "&cYou can only have &e{max} &cjobs at once!"
    no-permission: "&cYou don't have permission to join the &e{job} &cjob!"
    failed: "&cFailed to join the &e{job} &cjob!"
    job-not-found: "&cJob '&e{job}&c' not found!"
    
  # Leave Command
  leave:
    usage: "&cUsage: /jobs leave <job>"
    success: "&cYou left the &e{job} &cjob!"
    dont-have: "&cYou don't have the &e{job} &cjob!"
    failed: "&cFailed to leave the &e{job} &cjob!"
    job-not-found: "&cJob '&e{job}&c' not found!"
    default-job: "&cYou cannot leave the &e{job} &cjob as it is a default job!"
    
  # Info Command
  info:
    usage: "&cUsage: /jobs info <job|player>"
    not-found: "&cJob or player '{target}' not found!"
    job:
      header: "&6---- {job} ----"
      description: "&7Description: &f{description}"
      max-level: "&7Max Level: &e{level}"
      permission: "&7Permission: &f{permission}"
      lore-header: "&7Lore:"
      lore-line: "&f  {line}"
      action-types: "&7Action Types: &f{types}"
    
  # Stats Command
  stats:
    no-jobs-self: "&cYou don't have any jobs!"
    no-jobs-other: "&c{player} doesn't have any jobs!"
    header-self: "&6---- Your Jobs ----"
    header-other: "&6---- {player} Jobs ----"
    job-entry: "&e{job} &7- Level &a{level} &7({current_xp}/{required_xp} XP)"
    
  # List Command
  list:
    no-jobs: "&cNo jobs are available!"
    header: "&6---- Available Jobs ----"
    status-have: "&a✓"
    status-dont-have: "&c✗"
    
  # Menu Commands
  menu:
    invalid-format: "&cInvalid format! Use /jobs menu <type> [args]"
    unknown: "&cUnknown menu type: {type}"
    reload:
      success: "&aMenus reloaded successfully!"
    invalid-job-id: "&cInvalid job ID!"
    job-not-found: "&cJob '{job}' not found!"
    job-disabled: "&cThis job is disabled!"
    no-permission: "&cYou don't have permission to open this menu!"
    failed-open: "&cFailed to open {type} menu!"
    quick-help:
      header: "&7---- Quick Menu Help ----"
      main: "&e/jobs menu &7- Main menu"
      job-example: "&e/jobs menu {job} &7- {job} job menu"
      rankings: "&e/jobs menu rankings &7- Rankings"
    
  # Action Limit Commands
  actionlimit:
    no-permission: "&cYou don't have permission to use this command!"
    help: "&6---- Action Limit Commands ----\n&e/jobs actionlimit restore [player] &7- Restore limits\n&e/jobs actionlimit status <player> <job> <target> &7- View status"
    player-not-found: "&cPlayer '{player}' not found!"
    restore:
      usage: "&cUsage: /jobs actionlimit restore [player]"
      all-success: "&a{count} action limits restored for all players!"
      player-success: "&a{count} action limits restored for {player}!"
      player-notification: "&aYour action limits have been restored by an administrator!"
    status:
      usage: "&cUsage: /jobs actionlimit status <player> <job> <target>"
      header: "&7---- Action Limit Status ----"
      player: "&7Player: &e{player}"
      job: "&7Job: &e{job}"
      target: "&7Target: &e{target}"
      no-limits: "&7No limits configured for {job} -> {target} for {player}"
      cooldown: "&cCooldown: &e{minutes}m {seconds}s"
      available: "&aAvailable now"
      actions: "&7Actions: &e{current}/{max} &7(Limit: {limit})"
      blocking-both: "&cBlocking: XP and Money"
      blocking-xp: "&cBlocking: XP only"
      blocking-money: "&cBlocking: Money only"
      blocking-none: "&aNo blocking"
    
  # Rewards Commands
  rewards:
    no-permission: "&cYou don't have permission to use rewards!"
    help:
      header: "&6---- Reward Commands ----"
      open: "&e/jobs rewards open <job> &7- Open rewards GUI for a job"
      claim: "&e/jobs rewards claim <job> <rewardId> &7- Claim a specific reward"
    open:
      usage: "&cUsage: /jobs rewards open <job>"
    job-not-found: "&cJob '{job}' not found!"
    must-have-job: "&cYou must have the {job} job to view its rewards!"
    reward-not-found: "&cReward '{reward}' not found for job {job}!"

  bonus:
    give-usage: "&cUsage: /jobs {type} give <player|*> <multiplier> <duration> [job] [reason]"
    examples-header: "&7Examples:"
    example-global: "&7  /jobs {type} give * 2.0 3600 - Give all players 2x {type} for 1 hour"
    example-player: "&7  /jobs {type} give Player123 1.5 1800 miner Mining Event"
    remove-usage: "&cUsage: /jobs {type} remove <player> [job]"
    list-usage: "&cUsage: /jobs {type} list [player]"

  # Admin Commands
  admin:
    header: "&7---- UniverseJobs Admin Commands ----"
    give: "&e/jobs admin give <xp|level|custom> <give|set|remove> <player> <job> <amount> &7- Give XP/levels/rewards"
    boost: "&e/jobs admin boost <xp|money> <give|remove|list|info|cleanup> &7- Manage XP/money bonuses"
    forcejoin: "&e/jobs admin forcejoin <player> <job> &7- Force a player to join a job"
    forceleave: "&e/jobs admin forceleave <player> <job> &7- Force a player to leave a job"
    reset: "&e/jobs admin reset <player> [job|ALL] &7- Reset player data"
    info: "&e/jobs admin info <player> &7- Show player information"
    reload: "&e/jobs admin reload &7- Reload configuration and jobs"
    debug: "&e/jobs admin debug <xp|cache|config> &7- Debug XP/cache/config system"
    
    # Give help messages
    give-help-header: "&6---- Give Commands Help ----"
    give-help-xp: "&e/jobsadmin give xp <give|set|remove> <player> <job> <amount> &7- Manage XP"
    give-help-level: "&e/jobsadmin give level <give|remove> <player> <job> <amount> &7- Manage levels"
    give-help-custom: "&e/jobsadmin give custom <player> <job> <xp> <money> &7- Give custom rewards"
    
    # Common admin messages
    no-permission: "&cYou don't have permission to use this command!"
    player-not-found: "&cPlayer &e{player} &cnot found!"
    job-not-found: "&cJob &e{job} &cnot found!"
    player-no-job: "&c{player} doesn't have the job {job}!"
    invalid-action: "&cInvalid action! Use: {actions}"
    invalid-amount: "&cInvalid amount: {amount}"
    
    # Boost messages
    boost-invalid-type: "&cInvalid boost type! Use: xp or money"
    boost-invalid-player: "&cInvalid player name!"
    boost-invalid-job: "&cInvalid job ID!"
    boost-invalid-action-type: "&cInvalid action type!"
    boost-invalid-multiplier: "&cInvalid multiplier! Must be between 0.1 and 10.0"
    boost-invalid-duration: "&cInvalid duration! Must be between 1 and 86400 seconds"
    boost-invalid-action-id: "&cInvalid action ID for type {type}!"
    boost-applied: "&aApplied {type} boost x{multiplier} for {duration}s to {target} ({job} - {action}{action_id})"
    boost-remove-usage: "&cUsage: /jobs admin boost remove <boostId>"
    boost-remove-info-tip: "&7Use &e/jobs admin boost info&7 to see active boosts"
    boost-remove-success: "&aRemoved {type} boost: {id}"
    boost-remove-not-found: "&cBoost ID not found: {id}"
    boost-info-header: "&6=== Active Boosts ==="
    boost-info-none: "&7No active boosts"
    boost-info-xp-header: "&e&lXP Boosts:" 
    boost-info-money-header: "&6&lMoney Boosts:" 
    boost-info-entry: "&7  {id} &8- &f{player} &8| &a{multiplier}x &8| &e{job} &8| &b{action} &8| &c{time}"
    boost-info-remove-tip: "&7Use &e/jobs admin boost remove <boostId>&7 to remove a specific boost"
    boost-info-all-players: "All Players"
    boost-info-unknown-player: "Unknown"
    boost-info-all-jobs: "All Jobs"
    boost-info-all-actions: "All Actions"
    boost-help: |
      &6=== Boost Commands ===
      &e/jobs admin boost <action> <args...>

      &6Actions:
      &e  give <xp|money> <player/*> <job/*> <action_type> [id_in_action] <multiplier> <duration>
      &e  remove <boostId>
      &e  info

      &7Examples:
      &7  /jobs admin boost give xp * miner * 2.0 3600
      &7  /jobs admin boost give money Player123 * BREAK simple_break 1.5 1800
      &7  /jobs admin boost remove xp1
      &7  /jobs admin boost info
    boost-action-id-required: "&cWhen using specific action type, id_in_action is required!"
    boost-usage-with-action: "&7Usage: /jobs admin boost give <xp|money> <player/*> <job/*> <action_type> <id_in_action> <multiplier> <duration>"
    boost-usage-general: "&cUsage: /jobs admin boost give <xp|money> <player/*> <job/*> <action_type> [id_in_action] <multiplier> <duration>"
    
    # Give/Set/Remove success messages
    give-success: "&aGave rewards to &e{player} &afor job &e{job}"
    set-success: "&aSet rewards for &e{player} &ain job &e{job}"
    remove-success: "&aRemoved rewards from &e{player} &afor job &e{job}"
    give-failed: "&cFailed to give rewards to {player}"
    set-failed: "&cFailed to set rewards for {player}"
    remove-failed: "&cFailed to remove rewards from {player}"
    
    # Reset messages
    reset-confirmation: "&eAre you sure you want to reset &c{player}&e? Run the command again to confirm."
    reset-success: "&aReset &e{player}'s &aprogress! Cleaned &e{cleanedJobs}&a/&e{totalJobs} &ajobs."
    reset-job-success: "&aReset &e{job} &afor &e{player}!"
    reset-error: "&cError occurred while resetting player data!"
    
    # Give custom
    givecustom-success: "&aGave &e{player} &acustom rewards for &e{job}&a: &b{xp} XP &aand &6${money}"
    
    # Reload
    reload-start: "&6Reloading UniverseJobs..."
    reload-success: "&aUniverseJobs reloaded successfully!"

# =============
# REWARDS SYSTEM
# =============
rewards:
  claim:
    usage: "&cUsage: /jobs rewards claim <job> <rewardId>"
    success: "&aReward '{reward}' claimed successfully!"
    failed: "&cFailed to claim reward '{reward}'!"
    already-claimed: "&7You have already claimed this reward."
    no-job: "&cYou must have the {job} job to claim this reward!"
    level-requirement: "&cYou must be level {level} in the {job} job to claim this reward!"
    no-permission: "&cYou don't have the '{permission}' permission required for this reward!"
    requirements-not-met: "&cYou don't meet all requirements to claim this reward!"
    cooldown: "&cYou must wait {time} before claiming this reward again!"
  
  gui:
    job-not-found: "&cJob '{job}' not found!"
    no-rewards: "&cNo rewards available for job '{job}'!"
    no-available-rewards: "&cNo rewards available for your level in job '{job}'!"


# =============
# BOOST GUI
# =============
boost-gui:
  removed: "&aRemoved {type} boost: &e{boost_id}"
  no-permission: "&cYou don't have permission to do that!"
  refresh-clicked: "&bRefreshing boost list..."
