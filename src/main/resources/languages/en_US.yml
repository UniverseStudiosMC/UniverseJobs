# English (United States) language file for UniverseJobs - Clean version
# This file contains only the messages actually used in the code

# XP and leveling messages
xp:
  gain-message:
    default: "<#FFD700>+{xp} XP (</#FFD700><#32CD32>{job}</#32CD32><#FFD700>)"
  level-up: "<#32CD32>Congratulations! You reached level </#32CD32><#FFD700>{level}</#FFD700><#32CD32> in </#32CD32><#FFD700>{job}</#FFD700><#32CD32>!"

# XP Bonus system messages
xp-bonus:
  global-announced: "<#FFD700><bold>BONUS XP!</bold> <#32CD32>All players received </#32CD32><#FFD700>{bonus}%</#FFD700><#32CD32> bonus XP for </#32CD32><#FFD700>{duration}</#FFD700><#32CD32>!"
  added: "<#32CD32><bold>XP BOOST!</bold> </#32CD32><#FFD700>+{bonus}% XP</#FFD700><#32CD32> for </#32CD32><#FFD700>{duration} </#FFD700><#32CD32>({reason})"
  expired: "<#FF6B6B><bold>XP BOOST EXPIRED!</bold> <gray>{bonus}% bonus ended ({reason})"

# Command system messages
commands:
  players-only: "<#FF6B6B>This command can only be used by players!"
  no-permission: "<#FF6B6B>You don't have permission to use this command!"
  player-not-found: "<#FF6B6B>Player not found!"
  
  # Join command
  join:
    usage: "<#FF6B6B>Usage: /job join <job>"
    success: "<#32CD32>You joined the </#32CD32><#FFD700>{job}</#FFD700><#32CD32> job!"
    already-have: "<#FF6B6B>You already have the </#FF6B6B><#FFD700>{job}</#FFD700><#FF6B6B> job!"
    max-jobs-reached: "<#FF6B6B>You can only have </#FF6B6B><#FFD700>{max}</#FFD700><#FF6B6B> jobs at once!"
    no-permission: "<#FF6B6B>You don't have permission to join the </#FF6B6B><#FFD700>{job}</#FFD700><#FF6B6B> job!"
    failed: "<#FF6B6B>Failed to join the </#FF6B6B><#FFD700>{job}</#FFD700><#FF6B6B> job!"
    job-not-found: "<#FF6B6B>Job '</#FF6B6B><#FFD700>{job}</#FFD700><#FF6B6B>' not found!"
    
  # Leave command
  leave:
    usage: "<#FF6B6B>Usage: /job leave <job>"
    success: "<#FF6B6B>You left the </#FF6B6B><#FFD700>{job}</#FFD700><#FF6B6B> job!"
    dont-have: "<#FF6B6B>You don't have the </#FF6B6B><#FFD700>{job}</#FFD700><#FF6B6B> job!"
    failed: "<#FF6B6B>Failed to leave the </#FF6B6B><#FFD700>{job}</#FFD700><#FF6B6B> job!"
    job-not-found: "<#FF6B6B>Job '</#FF6B6B><#FFD700>{job}</#FFD700><#FF6B6B>' not found!"
    default-job: "<#FF6B6B>You cannot leave the </#FF6B6B><#FFD700>{job}</#FFD700><#FF6B6B> job as it is a default job!"
    
  # Info command
  info:
    not-found: "&cJob or player '{target}' not found!"
    job:
      header: "&6---- {job} ----"
      description: "&7Description: &f{description}"
      max-level: "&7Max Level: &e{level}"
      permission: "&7Permission: &f{permission}"
      lore-header: "&7Lore:"
      lore-line: "&f  {line}"
      action-types: "&7Action Types: &f{actionTypes}"
    
  # Stats command
  stats:
    no-jobs-self: "<#FF6B6B>You don't have any jobs!"
    no-jobs-other: "<#FF6B6B>{player} doesn't have any jobs!"
    header-self: "<#FFD700>---- Your Jobs ----"
    header-other: "<#FFD700>---- {player} Jobs ----"
    job-entry: "<#FFD700>{job} <gray>- Level </#gray><#32CD32>{level} </#32CD32><gray>({currentXp}/{requiredXp} XP)"
    
  # List command
  list:
    no-jobs: "<#FF6B6B>No jobs are available!"
    header: "<#FFD700>---- Available Jobs ----"
    status-have: "<#32CD32>✓"
    status-dont-have: "<#FF6B6B>✗"
    
  # XP Bonus commands
  xpbonus:
    usage:
      header: "&6---- XP Bonus Commands ----"
      global: "&e/job xpbonus <multiplier> <duration> &7- Give global XP bonus"
      player: "&e/job xpbonus <player> <multiplier> <duration> &7- Give player XP bonus"
      job: "&e/job xpbonus <player> <job> <multiplier> <duration> &7- Give job-specific bonus"
      examples: "&7Examples: /job xpbonus 2.0 300, /job xpbonus Steve 1.5 600"
    invalid-numbers: "§cInvalid multiplier or duration! Use numbers only."
    invalid-multiplier: "§cMultiplier must be between 0.1 and 10.0!"
    invalid-duration: "§cDuration must be between 1 second and 24 hours (86400 seconds)!"
    job-not-exist: "§cJob '{job}' does not exist!"
    gave-global: "§aGave {multiplier}x XP bonus to {playerCount} online players for {duration}"
    player-offline: "§cPlayer '{player}' is not online!"
    gave-player: "§aGave {player} {bonus}% XP bonus for {duration} ({job})"
    
  # Menu commands
  menu:
    invalid-format: "&cInvalid format! Use /jobs menu <type> [args]"
    unknown: "&cUnknown menu type: {type}"
    reload:
      success: "&aMenus reloaded successfully!"
    invalid-job-id: "&cInvalid job ID!"
    job-not-found: "&cJob '{job}' not found!"
    job-disabled: "&cThis job is disabled!"
    no-permission: "&cYou don't have permission to open this menu!"
    failed-open: "&cFailed to open {type} menu!"
    quick-help:
      header: "&7---- Quick Menu Help ----"
      main: "&e/jobs menu &7- Main menu"
      job-example: "&e/jobs menu {job} &7- {job} job menu"
      rankings: "&e/jobs menu rankings &7- Rankings"
    
  # Action limit commands
  actionlimit:
    no-permission: "&cYou don't have permission to use this command!"
    help: "&6---- Action Limit Commands ----\n&e/jobs actionlimit restore [player] &7- Restore limits\n&e/jobs actionlimit status <player> <job> <target> &7- View status"
    player-not-found: "&cPlayer '{player}' not found!"
    restore:
      usage: "&cUsage: /jobs actionlimit restore [player]"
      all-success: "&a{count} action limits restored for all players!"
      player-success: "&a{count} action limits restored for {player}!"
      player-notification: "&aYour action limits have been restored by an administrator!"
    status:
      usage: "&cUsage: /jobs actionlimit status <player> <job> <target>"
      header: "&7---- Action Limit Status ----"
      player: "&7Player: &e{player}"
      job: "&7Job: &e{job}"
      target: "&7Target: &e{target}"
      no-limits: "&7No limits configured for {job} -> {target} for {player}"
      cooldown: "&cCooldown: &e{minutes}m {seconds}s"
      available: "&aAvailable now"
      actions: "&7Actions: &e{current}/{max} &7(Limit: {limit})"
      blocking-both: "&cBlocking: XP and Money"
      blocking-xp: "&cBlocking: XP only"
      blocking-money: "&cBlocking: Money only"
      blocking-none: "&aNo blocking"
    
  # Rewards commands
  rewards:
    no-permission: "&cYou don't have permission to use rewards!"
    help:
      header: "&6---- Reward Commands ----"
      open: "&e/jobs rewards open <job> &7- Open rewards GUI for a job"
      claim: "&e/jobs rewards claim <job> <rewardId> &7- Claim a specific reward"
    open:
      usage: "&cUsage: /jobs rewards open <job>"
    job-not-found: "&cJob '{job}' not found!"
    must-have-job: "&cYou must have the {job} job to view its rewards!"
    reward-not-found: "&cReward '{reward}' not found for job {job}!"
    
  # Admin commands
  admin:
    header: "&7---- UniverseJobs Admin Commands ----"
    give: "&e/jobs admin give <xp|level|custom> <give|set|remove> <player> <job> <amount> &7- Give XP/levels/rewards"
    boost: "&e/jobs admin boost <xp|money> <give|remove|list|info|cleanup> &7- Manage XP/money bonuses"
    forcejoin: "&e/jobs admin forcejoin <player> <job> &7- Force a player to join a job"
    forceleave: "&e/jobs admin forceleave <player> <job> &7- Force a player to leave a job"
    reset: "&e/jobs admin reset <player> [job|ALL] &7- Reset player data"
    info: "&e/jobs admin info <player> &7- Show player information"
    reload: "&e/jobs admin reload &7- Reload configuration and jobs"
    debug: "&e/jobs admin debug <xp|cache|config> &7- Debug XP/cache/config system"
    
    # Admin responses
    no-permission: "&cYou don't have permission to use this command."
    player-not-found: "&cPlayer {player} not found."
    job-not-found: "&cJob {job} not found."
    invalid-action: "&cInvalid action. Use: {actions}"
    invalid-amount: "&cInvalid amount: {amount}"
    
    # XP responses
    xp-given: "&a{amount} XP added to {player} for job {job}"
    xp-taken: "&a{amount} XP removed from {player} for job {job}"
    xp-set: "&a{player}'s XP set to {amount} for job {job}"
    xp-received: "&a{amount} XP received for {job} from {sender}"
    xp-lost: "&c{amount} XP lost for {job} (Admin action)"
    xp-set-notify: "&aYour XP for {job} has been set to {amount} by {sender}"
    
    # Force join/leave responses
    forcejoin-success: "&aPlayer &e{player}&a has been forced to join job &e{job}&a."
    forcejoin-notify: "&aYou have been added to job &e{job}&a by an administrator."
    forceleave-success: "&aPlayer &e{player}&a has been forced to leave job &e{job}&a."
    forceleave-notify: "&cYou have been removed from job &e{job}&c by an administrator."
    
    # Reset responses
    reset-success: "&aReset completed for {player}: {cleanedJobs} jobs, {totalJobs} total jobs"
    reset-notify: "&cYour job data has been reset by an administrator."
    reset-job-notify: "&cYour progress in job {job} has been reset by an administrator."
    
    # Cache responses
    cache-reloaded: "&aCache reloaded successfully."
    cache-stats-hitrate: "&eHit Rate: &a{rate}%"
    
    # Debug responses
    debug-job-line: "&7  {job} - Level {level} ({xp} XP)"
    debug-job-enabled: "&eJob Enabled: &a{enabled}"
    debug-actions-break: "&eBreak Actions: &a{count}"
    debug-cache-stats: "&eCache Stats: &a{stats}"
    debug-stat-entry: "&7  {key}: &a{value}"

# Rewards system
rewards:
  claim:
    usage: "&cUsage: /jobs rewards claim <job> <rewardId>"
    success: "&aReward '{reward}' claimed successfully!"
    failed: "&cFailed to claim reward '{reward}'!"
    already-claimed: "&7You have already claimed this reward."
    no-job: "&cYou must have the {job} job to claim this reward!"
    level-requirement: "&cYou must be level {level} in the {job} job to claim this reward!"
    no-permission: "&cYou don't have the '{permission}' permission required for this reward!"
    requirements-not-met: "&cYou don't meet all requirements to claim this reward!"
    cooldown: "&cYou must wait {time} before claiming this reward again!"

# GUI system messages
gui:
  rewards:
    title: "<#FFD700>{job} Rewards"
    job-label: "<gray>Job: </#gray><#FFD700>{job}"
    total-label: "<gray>Total Rewards: </#gray><#FFD700>{count}"
    page-label: "<gray>Page: </#gray><#FFD700>{current}/{total}"
    required-level: "<gray>Required Level: </#gray><#FFD700>{level}"
    status-label: "<gray>Status: {status}"
    repeatable-yes: "<gray>Repeatable: </#gray><#32CD32>Yes"
    repeatable-no: "<gray>Repeatable: </#gray><#FF6B6B>No"
    cooldown-label: "<gray>Cooldown: </#gray><#FFD700>{cooldown}"
    click-to-claim: "<#32CD32>▶ Click to claim!"
    claim-success: "<#32CD32>Reward claimed successfully!"
    claim-failed: "<#FF6B6B>Failed to claim reward."

# Boost GUI messages
boost-gui:
  removed: "<green>Removed {type} boost: <gold>{boost_id}</gold></green>"
  no-permission: "<red>You don't have permission to do that!</red>"
  refresh-clicked: "<aqua>Refreshing boost list...</aqua>"

# System messages (console/logger)
system:
  config-loaded: "Configuration loaded successfully"
  jobs-loaded: "Jobs loaded successfully"
  rewards-initialized: "Reward system initialized successfully"
  nexo-registered: "Nexo event listener registered for enhanced custom block support"
  itemsadder-registered: "ItemsAdder event listener registered for enhanced custom block support"
  plugin-enabled: "UniverseJobs has been enabled successfully!"
  plugin-disabled: "UniverseJobs has been disabled"