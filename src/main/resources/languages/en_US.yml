# =====================================
# UniverseJobs Language File - English
# =====================================

# =============
# GENERAL
# =============
general:
  prefix: "&6[&eUniverseJobs&6]&r"
  no-permission: "&cYou don't have permission to do this!"
  player-not-found: "&cPlayer &e%player% &cnot found!"
  job-not-found: "&cJob &e%job% &cnot found!"
  invalid-amount: "&cInvalid amount: &e%amount%"
  invalid-format: "&cInvalid format!"
  must-be-player: "&cThis command can only be executed by players!"

# =============
# COMMANDS
# =============
commands:
  # General command messages
  players-only: "&cThis command can only be used by players!"
  no-permission: "&cYou don't have permission to use this command!"
  player-not-found: "&cPlayer not found!"
  
  # Help Messages
  help:
    header: "&6======= &eUniverseJobs Help &6======="
    join: "&e/jobs join <job> &7- Join a job"
    leave: "&e/jobs leave <job> &7- Leave a job"
    info: "&e/jobs info <job/player> &7- Get information"
    stats: "&e/jobs stats [player] &7- View stats"
    list: "&e/jobs list &7- List all available jobs"
    rewards: "&e/jobs rewards <job> &7- Open rewards menu"
    menu: "&e/jobs menu &7- Open main menu"
    admin: "&e/jobs admin &7- Admin commands"
    
  # Join Command
  join:
    usage: "&cUsage: /jobs join <job>"
    success: "&aYou joined the &e%job% &ajob!"
    already-have: "&cYou already have the &e%job% &cjob!"
    max-jobs-reached: "&cYou can only have &e%max% &cjobs at once!"
    no-permission: "&cYou don't have permission to join the &e%job% &cjob!"
    failed: "&cFailed to join the &e%job% &cjob!"
    job-not-found: "&cJob '&e%job%&c' not found!"
    
  # Leave Command
  leave:
    usage: "&cUsage: /jobs leave <job>"
    success: "&cYou left the &e%job% &cjob!"
    dont-have: "&cYou don't have the &e%job% &cjob!"
    failed: "&cFailed to leave the &e%job% &cjob!"
    job-not-found: "&cJob '&e%job%&c' not found!"
    default-job: "&cYou cannot leave the &e%job% &cjob as it is a default job!"
    
  # Info Command
  info:
    usage: "&cUsage: /jobs info <job|player>"
    not-found: "&cJob or player '%target%' not found!"
    job:
      header: "&6---- %job% ----"
      description: "&7Description: &f%description%"
      max-level: "&7Max Level: &e%level%"
      permission: "&7Permission: &f%permission%"
      lore-header: "&7Lore:"
      lore-line: "&f  %line%"
      action-types: "&7Action Types: &f%actionTypes%"
    
  # Stats Command
  stats:
    no-jobs-self: "&cYou don't have any jobs!"
    no-jobs-other: "&c%player% doesn't have any jobs!"
    header-self: "&6---- Your Jobs ----"
    header-other: "&6---- %player% Jobs ----"
    job-entry: "&e%job% &7- Level &a%level% &7(%currentXp%/%requiredXp% XP)"
    
  # List Command
  list:
    no-jobs: "&cNo jobs are available!"
    header: "&6---- Available Jobs ----"
    entry: "&e%job% &7- %status%"
    status-have: "&a✓"
    status-dont-have: "&c✗"
    
  # XP Bonus Commands
  xpbonus:
    usage:
      header: "&6---- XP Bonus Commands ----"
      global: "&e/job xpbonus <multiplier> <duration> &7- Give global XP bonus"
      player: "&e/job xpbonus <player> <multiplier> <duration> &7- Give player XP bonus"
      job: "&e/job xpbonus <player> <job> <multiplier> <duration> &7- Give job-specific bonus"
      examples: "&7Examples: /job xpbonus 2.0 300, /job xpbonus Steve 1.5 600"
    invalid-numbers: "&cInvalid multiplier or duration! Use numbers only."
    invalid-multiplier: "&cMultiplier must be between 0.1 and 10.0!"
    invalid-duration: "&cDuration must be between 1 second and 24 hours (86400 seconds)!"
    job-not-exist: "&cJob '%job%' does not exist!"
    gave-global: "&aGave %multiplier%x XP bonus to %playerCount% online players for %duration%"
    player-offline: "&cPlayer '%player%' is not online!"
    gave-player: "&aGave %player% %bonus%% XP bonus for %duration% (%job%)"
    
  # Menu Commands
  menu:
    invalid-format: "&cInvalid format! Use /jobs menu <type> [args]"
    unknown: "&cUnknown menu type: %type%"
    reload:
      success: "&aMenus reloaded successfully!"
    invalid-job-id: "&cInvalid job ID!"
    job-not-found: "&cJob '%job%' not found!"
    job-disabled: "&cThis job is disabled!"
    no-permission: "&cYou don't have permission to open this menu!"
    failed-open: "&cFailed to open %type% menu!"
    quick-help:
      header: "&7---- Quick Menu Help ----"
      main: "&e/jobs menu &7- Main menu"
      job-example: "&e/jobs menu %job% &7- %job% job menu"
      rankings: "&e/jobs menu rankings &7- Rankings"
    
  # Action Limit Commands
  actionlimit:
    no-permission: "&cYou don't have permission to use this command!"
    help: "&6---- Action Limit Commands ----\n&e/jobs actionlimit restore [player] &7- Restore limits\n&e/jobs actionlimit status <player> <job> <target> &7- View status"
    player-not-found: "&cPlayer '%player%' not found!"
    restore:
      usage: "&cUsage: /jobs actionlimit restore [player]"
      all-success: "&a%count% action limits restored for all players!"
      player-success: "&a%count% action limits restored for %player%!"
      player-notification: "&aYour action limits have been restored by an administrator!"
    status:
      usage: "&cUsage: /jobs actionlimit status <player> <job> <target>"
      header: "&7---- Action Limit Status ----"
      player: "&7Player: &e%player%"
      job: "&7Job: &e%job%"
      target: "&7Target: &e%target%"
      no-limits: "&7No limits configured for %job% -> %target% for %player%"
      cooldown: "&cCooldown: &e%minutes%m %seconds%s"
      available: "&aAvailable now"
      actions: "&7Actions: &e%current%/%max% &7(Limit: %limit%)"
      blocking-both: "&cBlocking: XP and Money"
      blocking-xp: "&cBlocking: XP only"
      blocking-money: "&cBlocking: Money only"
      blocking-none: "&aNo blocking"
    
  # Rewards Commands
  rewards:
    no-permission: "&cYou don't have permission to use rewards!"
    help:
      header: "&6---- Reward Commands ----"
      open: "&e/jobs rewards open <job> &7- Open rewards GUI for a job"
      claim: "&e/jobs rewards claim <job> <rewardId> &7- Claim a specific reward"
    open:
      usage: "&cUsage: /jobs rewards open <job>"
    job-not-found: "&cJob '%job%' not found!"
    must-have-job: "&cYou must have the %job% job to view its rewards!"
    reward-not-found: "&cReward '%reward%' not found for job %job%!"
    
  # Admin Commands
  admin:
    header: "&7---- UniverseJobs Admin Commands ----"
    give: "&e/jobs admin give <xp|level|custom> <give|set|remove> <player> <job> <amount> &7- Give XP/levels/rewards"
    boost: "&e/jobs admin boost <xp|money> <give|remove|list|info|cleanup> &7- Manage XP/money bonuses"
    forcejoin: "&e/jobs admin forcejoin <player> <job> &7- Force a player to join a job"
    forceleave: "&e/jobs admin forceleave <player> <job> &7- Force a player to leave a job"
    reset: "&e/jobs admin reset <player> [job|ALL] &7- Reset player data"
    info: "&e/jobs admin info <player> &7- Show player information"
    reload: "&e/jobs admin reload &7- Reload configuration and jobs"
    debug: "&e/jobs admin debug <xp|cache|config> &7- Debug XP/cache/config system"
    
    # Admin responses
    no-permission: "&cYou don't have permission to use this command."
    player-not-found: "&cPlayer %player% not found."
    job-not-found: "&cJob %job% not found."
    invalid-action: "&cInvalid action. Use: %actions%"
    invalid-amount: "&cInvalid amount: %amount%"
    
    # XP management
    usage:
      xp: "&cUsage: /jobsadmin xp <give|take|set> <player> <job> <amount>"
      level: "&cUsage: /jobsadmin level <give|take> <player> <job> <amount>"
      forcejoin: "&cUsage: /jobsadmin forcejoin <player> <job>"
      forceleave: "&cUsage: /jobsadmin forceleave <player> <job>"
      reset: "&cUsage: /jobsadmin reset <player> [job]"
      givecustom: "&cUsage: /jobsadmin givecustom <player> <job> <xp> <money>"
      info: "&cUsage: /jobsadmin info <player>"
      debug: "&cUsage: /jobsadmin debug <xp|cache|config>"
    
    xp-given: "&a%amount% XP added to %player% for job %job%"
    xp-taken: "&a%amount% XP removed from %player% for job %job%"
    xp-set: "&a%player%'s XP set to %amount% for job %job%"
    xp-received: "&a%amount% XP received for %job% from %sender%"
    xp-lost: "&c%amount% XP lost for %job% (Admin action)"
    xp-set-notify: "&aYour XP for %job% has been set to %amount% by %sender%"
    xp-error: "&cError modifying XP: %error%"
    
    # Level management
    level-given: "&a%amount% levels added to %player% for job %job% (now level %level%)"
    level-taken: "&a%amount% levels removed from %player% for job %job% (now level %level%)"
    level-received: "&aYou received %amount% levels for %job%!"
    level-lost: "&cYou lost %amount% levels for %job%!"
    level-error: "&cError modifying level: %error%"
    
    # Force join/leave
    forcejoin-success: "&aPlayer &e%player%&a has been forced to join job &e%job%&a."
    forcejoin-notify: "&aYou have been added to job &e%job%&a by an administrator."
    forcejoin-failed: "&cFailed to force join!"
    forceleave-success: "&aPlayer &e%player%&a has been forced to leave job &e%job%&a."
    forceleave-notify: "&cYou have been removed from job &e%job%&c by an administrator."
    forceleave-failed: "&cFailed to force leave!"
    
    # Reset
    reset-confirmation: "&eAre you sure you want to reset &c%player%&e? Type the command again to confirm."
    reset-success: "&aReset completed for %player%: %cleanedJobs% jobs, %totalJobs% total jobs"
    reset-job-success: "&aReset %job% for %player%!"
    reset-notify: "&cYour job data has been reset by an administrator."
    reset-job-notify: "&cYour progress in job %job% has been reset by an administrator."
    reset-error: "&cError resetting player data!"
    
    # Give custom
    givecustom-success: "&aGave %player% custom rewards for %job%: %xp% XP and $%money%"
    player-no-job: "&c%player% doesn't have the job %job%!"
    
    # Info
    debug-header: "&7---- Debug Info for %player% ----"
    debug-jobs: "&7Total jobs: &e%count%"
    debug-job-line: "&7  %job% - Level %level% (%xp% XP)"
    
    # Reload
    reload-start: "&6Reloading UniverseJobs..."
    reload-success: "&aUniverseJobs reloaded successfully!"
    reload-failed: "&cFailed to reload: %error%"
    
    # Debug
    debug-invalid-type: "&cInvalid debug type: %type%"
    debug-available-types: "&7Available types: xp, cache, config"
    debug-xp-header: "&6=== XP Debug Info ==="
    debug-job-enabled: "&eJob Enabled: &a%enabled%"
    debug-actions-break: "&eBreak Actions: &a%count%"
    debug-cache-configured: "&aCache is configured"
    debug-cache-not-configured: "&cCache is not configured"
    debug-enabled: "&7Debug enabled: %enabled%"
    debug-show-xp: "&7Show XP: %enabled%"
    debug-cache-header: "&6=== Cache Statistics ==="
    debug-cache-stats: "&eCache Stats: &a%stats%"
    debug-stat-entry: "&7  %key%: &a%value%"
    debug-config-header: "&6=== Configuration Debug ==="
    cache-stats-hitrate: "&eHit Rate: &a%rate%%"
    cache-reloaded: "&aCache reloaded successfully."

# =============
# XP & LEVELING
# =============
xp:
  # Gain Messages
  gain-message:
    default: "&a+%xp% XP (&e%job%&a)"
    with-bonus: "&a+%xp% XP (&e+%bonus%&a) for &e%job%"
    
  # Level Up
  level-up: "&6&lLEVEL UP! &aYou reached level &6%level% &ain &e%job%&a!"
  level-up-broadcast: "&e%player% &ahas reached level &6%level% &ain &e%job%&a!"
    
  # Action Bar
  actionbar:
    format: "&e%job%: &a%xp% XP"
    
  # Boss Bar
  bossbar:
    format: "&e%job% &7| &aLevel %level% &7| &b%currentXp%&7/&3%requiredXp% XP"

# =============
# BONUS SYSTEM
# =============
xp-bonus:
  global-announced: "&6&lBONUS XP! &aAll players received &6%bonus%% &abonus XP for &e%duration%&a!"
  added: "&a&lXP BOOST! &e+%bonus%% XP &afor &e%duration% &7(%reason%)"
  expired: "&c&lXP BOOST EXPIRED! &7%bonus%% bonus ended (%reason%)"

# =============
# REWARDS SYSTEM
# =============
rewards:
  claim:
    usage: "&cUsage: /jobs rewards claim <job> <rewardId>"
    success: "&aReward '%reward%' claimed successfully!"
    failed: "&cFailed to claim reward '%reward%'!"
    already-claimed: "&7You have already claimed this reward."
    no-job: "&cYou must have the %job% job to claim this reward!"
    level-requirement: "&cYou must be level %level% in the %job% job to claim this reward!"
    no-permission: "&cYou don't have the '%permission%' permission required for this reward!"
    requirements-not-met: "&cYou don't meet all requirements to claim this reward!"
    cooldown: "&cYou must wait %time% before claiming this reward again!"

# =============
# GUI MESSAGES
# =============
gui:
  rewards:
    title: "&6%job% Rewards"
    job-label: "&7Job: &e%job%"
    total-label: "&7Total Rewards: &e%count%"
    page-label: "&7Page: &e%current%/%total%"
    required-level: "&7Required Level: &e%level%"
    status-label: "&7Status: %status%"
    repeatable-yes: "&7Repeatable: &aYes"
    repeatable-no: "&7Repeatable: &cNo"
    cooldown-label: "&7Cooldown: &e%cooldown%"
    click-to-claim: "&a▶ Click to claim!"
    claim-success: "&aReward claimed successfully!"
    claim-failed: "&cFailed to claim reward."

# =============
# BOOST GUI
# =============
boost-gui:
  removed: "&aRemoved %type% boost: &e%boost_id%"
  no-permission: "&cYou don't have permission to do that!"
  refresh-clicked: "&bRefreshing boost list..."

# =============
# PROTECTION
# =============
protection:
  block:
    placed-recently: "&cThis block was placed recently and gives no rewards!"
    protected: "&cThis block is protected!"
    
  entity:
    spawned-recently: "&cThis entity was spawned recently and gives no rewards!"
    protected: "&cThis entity is protected!"


# =============
# PLACEHOLDERS
# =============
placeholders:
  no-job: "&7None"
  no-data: "&7N/A"
  unlimited: "&aUnlimited"
  never: "&7Never"
  now: "&aNow"
  enabled: "&aEnabled"
  disabled: "&cDisabled"
  true: "&aTrue"
  false: "&cFalse"
  yes: "&aYes"
  no: "&cNo"