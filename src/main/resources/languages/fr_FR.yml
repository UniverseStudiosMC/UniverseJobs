# =====================================
# UniverseJobs Language File - Français
# =====================================

# =============
# GÉNÉRAL
# =============
general:
  prefix: "&6[&eUniverseJobs&6]&r"
  no-permission: "&cVous n'avez pas la permission de faire cela !"
  player-not-found: "&cJoueur &e{player} &cintrouvable !"
  job-not-found: "&cMétier &e{job} &cintrouvable !"
  invalid-amount: "&cMontant invalide : &e{amount}"
  invalid-format: "&cFormat invalide !"
  must-be-player: "&cCette commande ne peut être exécutée que par des joueurs !"

# =============
# COMMANDES
# =============
commands:
  # Messages généraux des commandes
  players-only: "&cCette commande ne peut être utilisée que par les joueurs !"
  no-permission: "&cVous n'avez pas la permission d'utiliser cette commande !"
  player-not-found: "&cJoueur introuvable !"
  
  # Messages d'aide
  help:
    header: "&6======= &eAide UniverseJobs &6======="
    join: "&e/jobs join <métier> &7- Rejoindre un métier"
    leave: "&e/jobs leave <métier> &7- Quitter un métier"
    info: "&e/jobs info <métier/joueur> &7- Obtenir des informations"
    stats: "&e/jobs stats [joueur] &7- Voir les statistiques"
    list: "&e/jobs list &7- Lister tous les métiers disponibles"
    rewards: "&e/jobs rewards <métier> &7- Ouvrir le menu des récompenses"
    menu: "&e/jobs menu &7- Ouvrir le menu principal"
    admin: "&e/jobs admin &7- Commandes administrateur"
    
  # Commande join
  join:
    usage: "&cUtilisation : /jobs join <métier>"
    success: "&aVous avez rejoint le métier &e{job} &a!"
    already-have: "&cVous avez déjà le métier &e{job} &c!"
    max-jobs-reached: "&cVous ne pouvez avoir que &e{max} &cmétiers à la fois !"
    no-permission: "&cVous n'avez pas la permission de rejoindre le métier &e{job} &c!"
    failed: "&cÉchec lors de l'adhésion au métier &e{job} &c!"
    job-not-found: "&cMétier '&e{job}&c' introuvable !"
    
  # Commande leave
  leave:
    usage: "&cUtilisation : /jobs leave <métier>"
    success: "&cVous avez quitté le métier &e{job} &c!"
    dont-have: "&cVous n'avez pas le métier &e{job} &c!"
    failed: "&cÉchec lors de l'abandon du métier &e{job} &c!"
    job-not-found: "&cMétier '&e{job}&c' introuvable !"
    default-job: "&cVous ne pouvez pas quitter le métier &e{job} &ccar c'est un métier par défaut !"
    
  # Commande info
  info:
    usage: "&cUtilisation : /jobs info <métier|joueur>"
    not-found: "&cMétier ou joueur '{target}' introuvable !"
    job:
      header: "&6---- {job} ----"
      description: "&7Description : &f{description}"
      max-level: "&7Niveau max : &e{level}"
      permission: "&7Permission : &f{permission}"
      lore-header: "&7Histoire :"
      lore-line: "&f  {line}"
      action-types: "&7Types d'actions : &f{types}"
    
  # Commande stats
  stats:
    no-jobs-self: "&cVous n'avez aucun métier !"
    no-jobs-other: "&c{player} n'a aucun métier !"
    header-self: "&6---- Vos métiers ----"
    header-other: "&6---- Métiers de {player} ----"
    job-entry: "&e{job} &7- Niveau &a{level} &7({current_xp}/{required_xp} XP)"
    
  # Commande list
  list:
    no-jobs: "&cAucun métier disponible !"
    header: "&6---- Métiers disponibles ----"
    entry: "&e{job} &7- %status%"
    status-have: "&a✓"
    status-dont-have: "&c✗"
    
    
  # Commandes menu
  menu:
    invalid-format: "&cFormat invalide ! Utilisez /jobs menu <type> [args]"
    unknown: "&cType de menu inconnu : {type}"
    reload:
      success: "&aMenus rechargés avec succès !"
    invalid-job-id: "&cID de métier invalide !"
    job-not-found: "&cMétier '{job}' introuvable !"
    job-disabled: "&cCe métier est désactivé !"
    no-permission: "&cVous n'avez pas la permission d'ouvrir ce menu !"
    failed-open: "&cÉchec de l'ouverture du menu {type} !"
    quick-help:
      header: "&7---- Aide rapide des menus ----"
      main: "&e/jobs menu &7- Menu principal"
      job-example: "&e/jobs menu {job} &7- Menu du métier {job}"
      rankings: "&e/jobs menu rankings &7- Classements"
    
  # Commandes de limite d'actions
  actionlimit:
    no-permission: "&cVous n'avez pas la permission d'utiliser cette commande !"
    help: "&6---- Commandes de limites d'actions ----\n&e/jobs actionlimit restore [joueur] &7- Restaurer les limites\n&e/jobs actionlimit status <joueur> <métier> <cible> &7- Voir le statut"
    player-not-found: "&cJoueur '{player}' introuvable !"
    restore:
      usage: "&cUtilisation : /jobs actionlimit restore [joueur]"
      all-success: "&a{count} limites d'actions restaurées pour tous les joueurs !"
      player-success: "&a{count} limites d'actions restaurées pour {player} !"
      player-notification: "&aVos limites d'actions ont été restaurées par un administrateur !"
    status:
      usage: "&cUtilisation : /jobs actionlimit status <joueur> <métier> <cible>"
      header: "&7---- Statut des limites d'actions ----"
      player: "&7Joueur : &e{player}"
      job: "&7Métier : &e{job}"
      target: "&7Cible : &e{target}"
      no-limits: "&7Aucune limite configurée pour {job} -> {target} pour {player}"
      cooldown: "&cTemps de recharge : &e{minutes}m {seconds}s"
      available: "&aDisponible maintenant"
      actions: "&7Actions : &e{current}/{max} &7(Limite : {limit})"
      blocking-both: "&cBloque : XP et Argent"
      blocking-xp: "&cBloque : XP seulement"
      blocking-money: "&cBloque : Argent seulement"
      blocking-none: "&aAucun blocage"
    
  # Commandes de récompenses
  rewards:
    no-permission: "&cVous n'avez pas la permission d'utiliser les récompenses !"
    help:
      header: "&6---- Commandes de récompenses ----"
      open: "&e/jobs rewards open <métier> &7- Ouvrir l'interface des récompenses"
      claim: "&e/jobs rewards claim <métier> <idRécompense> &7- Réclamer une récompense"
    open:
      usage: "&cUtilisation : /jobs rewards open <métier>"
    job-not-found: "&cMétier '{job}' introuvable !"
    must-have-job: "&cVous devez avoir le métier {job} pour voir ses récompenses !"
    reward-not-found: "&cRécompense '{reward}' introuvable pour le métier {job} !"
    
  # Commandes admin
  admin:
    header: "&7---- Commandes Admin UniverseJobs ----"
    give: "&e/jobs admin give <xp|level|custom> <give|set|remove> <joueur> <métier> <montant> &7- Donner XP/niveaux/récompenses"
    boost: "&e/jobs admin boost <xp|money> <give|remove|list|info|cleanup> &7- Gérer les bonus XP/argent"
    forcejoin: "&e/jobs admin forcejoin <joueur> <métier> &7- Forcer un joueur à rejoindre un métier"
    forceleave: "&e/jobs admin forceleave <joueur> <métier> &7- Forcer un joueur à quitter un métier"
    reset: "&e/jobs admin reset <joueur> [métier|ALL] &7- Réinitialiser les données du joueur"
    info: "&e/jobs admin info <joueur> &7- Afficher les informations du joueur"
    reload: "&e/jobs admin reload &7- Recharger la configuration et les métiers"
    debug: "&e/jobs admin debug <xp|cache|config> &7- Déboguer le système XP/cache/config"
    
    # Messages d'aide give
    give-help-header: "&6---- Aide Commandes Give ----"
    give-help-xp: "&e/jobsadmin give xp <give|set|remove> <joueur> <métier> <montant> &7- Gérer l'XP"
    give-help-level: "&e/jobsadmin give level <give|remove> <joueur> <métier> <montant> &7- Gérer les niveaux"
    give-help-custom: "&e/jobsadmin give custom <joueur> <métier> <xp> <argent> &7- Donner des récompenses personnalisées"
    
    # Messages admin communs
    no-permission: "&cVous n'avez pas la permission d'utiliser cette commande !"
    player-not-found: "&cJoueur &e{player} &cintrouvable !"
    job-not-found: "&cMétier &e{job} &cintrouvable !"
    player-no-job: "&c{player} n'a pas le métier {job} !"
    invalid-action: "&cAction invalide ! Utilisez : {actions}"
    invalid-amount: "&cMontant invalide : {amount}"
    
    # Messages boost
    boost-action-id-required: "&cLors de l'utilisation d'un type d'action spécifique, id_in_action est requis !"
    boost-usage-with-action: "&7Usage : /jobs admin boost give <xp|money> <joueur/*> <métier/*> <type_action> <id_in_action> <multiplicateur> <durée>"
    boost-usage-general: "&cUsage : /jobs admin boost give <xp|money> <joueur/*> <métier/*> <type_action> [id_in_action] <multiplicateur> <durée>"
    
    # Messages de succès Give/Set/Remove
    give-success: "&aDonné des récompenses à &e{player} &apour le métier &e{job}"
    set-success: "&aDéfini les récompenses pour &e{player} &adans le métier &e{job}"
    remove-success: "&aRetiré les récompenses de &e{player} &apour le métier &e{job}"
    give-failed: "&cÉchec du don de récompenses à {player}"
    set-failed: "&cÉchec de la définition des récompenses pour {player}"
    remove-failed: "&cÉchec du retrait des récompenses de {player}"
    
    # Messages de reset
    reset-confirmation: "&eÊtes-vous sûr de vouloir réinitialiser &c{player}&e ? Relancez la commande pour confirmer."
    reset-success: "&aRéinitialisation de &e{player} &aterminée ! Nettoyé &e{cleanedJobs}&a/&e{totalJobs} &amétiers."
    reset-job-success: "&aRéinitialisation de &e{job} &apour &e{player} !"
    reset-error: "&cErreur lors de la réinitialisation des données du joueur !"
    
    # Give custom
    givecustom-success: "&aDonné à &e{player} &ades récompenses personnalisées pour &e{job}&a : &b{xp} XP &aet &6{money}€"
    
    # Reload
    reload-start: "&6Rechargement d'UniverseJobs..."
    reload-success: "&aUniverseJobs rechargé avec succès !"

# =============
# SYSTÈME DE RÉCOMPENSES
# =============
rewards:
  claim:
    usage: "&cUtilisation : /jobs rewards claim <métier> <idRécompense>"
    success: "&aRécompense '{reward}' réclamée avec succès !"
    failed: "&cÉchec de réclamation de la récompense '{reward}' !"
    already-claimed: "&7Vous avez déjà réclamé cette récompense."
    no-job: "&cVous devez avoir le métier {job} pour réclamer cette récompense !"
    level-requirement: "&cVous devez être niveau {level} dans le métier {job} pour réclamer cette récompense !"
    no-permission: "&cVous n'avez pas la permission '{permission}' requise pour cette récompense !"
    requirements-not-met: "&cVous ne remplissez pas toutes les conditions pour réclamer cette récompense !"
    cooldown: "&cVous devez attendre {time} avant de pouvoir réclamer cette récompense à nouveau !"
  
  gui:
    job-not-found: "&cMétier '{job}' introuvable !"
    no-rewards: "&cAucune récompense disponible pour le métier '{job}' !"
    no-available-rewards: "&cAucune récompense disponible pour votre niveau dans le métier '{job}' !"


# =============
# BOOST GUI
# =============
boost-gui:
  removed: "&aBoost {type} supprimé : &e{boost_id}"
  no-permission: "&cVous n'avez pas la permission de faire cela !"
  refresh-clicked: "&bActualisation de la liste des boosts..."

# =============
# PROTECTION
# =============
protection:
  block:
    placed-recently: "&cCe bloc a été placé récemment et ne donne aucune récompense !"
    protected: "&cCe bloc est protégé !"
    
  entity:
    spawned-recently: "&cCette entité a été générée récemment et ne donne aucune récompense !"
    protected: "&cCette entité est protégée !"

